name: ✅ Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      runner:
        description: >
          Runner label for every heavy Validate job on this manual run. Leave as
          "(repo default)" to use vars.CI_RUNNER (else WarpBuild), matching
          push/PR. Choose ubuntu-latest for a GitHub-hosted comparison. The
          final ✅ Validate gate always runs on ubuntu-latest.
        type: choice
        options:
          - (repo default)
          - warp-ubuntu-latest-x64-4x
          - ubuntu-latest
        default: (repo default)
      no_cache:
        description: >
          Skip every Validate cache layer (Nx remote token unbound,
          NX_SKIP_NX_CACHE, setup-node npm cache, Playwright actions/cache) and
          run a fresh npm ci. Use for apples-to-apples runner timing baselines.
          Default true on manual dispatch; push/PR runs ignore this and keep
          normal caching.
        type: boolean
        default: true
  workflow_call:
    inputs:
      runner:
        description:
          Runner label (e.g. ubuntu-latest or warp-ubuntu-latest-x64-4x)
        type: string
        required: false
        default: ubuntu-latest
      no_cache:
        description: Disable every Validate cache layer and use a fresh npm ci
        type: boolean
        required: false
        default: false
      iteration:
        description: Bench iteration number (artifacts + concurrency isolation)
        type: number
        required: false
        default: 1

permissions:
  contents: read

# Pin CI=1 (not GitHub's CI=true) so Nx cache hashes match local
# `validate` / `test:push`. Anyone who can push already has the write
# token locally, so same-repo validate (push, workflow_dispatch, and
# non-fork pull_request) presents it too. Fork PRs use the read token
# only: a missing read secret stays empty and does not fall through
# to write. Literal secret refs only — do not index `secrets[...]`
# (overprovisions the whole secrets context). Nx treats an
# unreachable self-hosted cache as a fatal error, so setup-validate
# probes before setting the server URL. Cached npm scripts then run
# through tools/run-nx.ts so a rejected token or a mid-run /v1/cache
# transport flake cannot fail the job after tasks already succeeded.
# no_cache (dispatch or workflow_call): leave the remote-cache token empty
# and set NX_SKIP_NX_CACHE so neither remote nor local Nx cache is used.
env:
  CI: '1'
  VALIDATE_NO_CACHE: ${{ inputs.no_cache == true && 'true' || 'false' }}
  # Same expression as heavy-job runs-on. Push/PR leave inputs.runner empty and
  # use vars.CI_RUNNER (else WarpBuild); workflow_call always sets it (default
  # ubuntu-latest). The final gate job ignores this and stays on ubuntu-latest.
  VALIDATE_RUNNER:
    ${{ (inputs.runner != '' && inputs.runner != '(repo default)' &&
    inputs.runner) || vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
  VALIDATE_ITERATION: ${{ inputs.iteration || 0 }}
  NX_SKIP_NX_CACHE: ${{ inputs.no_cache == true && 'true' || '' }}
  NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: >-
    ${{ inputs.no_cache != true && (github.event.pull_request.head.repo.fork ==
    true && secrets.NX_SELF_HOSTED_REMOTE_CACHE_READ_TOKEN ||
    github.event.pull_request.head.repo.fork != true &&
    secrets.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN || '') || '' }}

# PR and manual runs cancel superseded runs. `main` pushes queue instead: a
# busy `main` cancelled every run and starved production deploys (#3380). One
# run stays in progress and GitHub replaces the pending one with the newest
# push; deploy.yml's sha-guard can deploy any completed run that is ahead of
# production, though its own queue may replace an older pending deploy.
# Runner / no_cache / iteration keep bench matrix cells and ubuntu-vs-warp
# dispatches from cancelling each other. The runner segment is the label
# jobs actually use (inputs.runner, or WarpBuild when that input is absent).
# Manual / validate-bench runs (caller event is workflow_dispatch; reusable
# workflows inherit that name, not workflow_call) also key on run_id so two
# overlapping uncached benches on the same runner do not cancel matching
# iterations while cancel-in-progress stays true for PR runs.
concurrency:
  group: >-
    validate-${{ github.event_name }}-${{ github.event.pull_request.number ||
    github.ref }}-${{ (inputs.runner != '' && inputs.runner != '(repo default)'
    && inputs.runner) || vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x'
    }}-nocache-${{ inputs.no_cache || false }}-iter-${{ inputs.iteration || 0
    }}${{ github.event_name == 'workflow_dispatch' && format('-run-{0}',
    github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Same checks as `npm run validate`, split across runners so CPU-heavy suites
# (node/workers unit, Playwright E2E, MCP E2E, typecheck) do not contend on one
# machine. Local `npm run validate` remains the authoritative single-command
# gate.
jobs:
  static:
    runs-on:
      ${{ (inputs.runner != '' && inputs.runner != '(repo default)' &&
      inputs.runner) || vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🧹 Static
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: ⏱️ Mark job start
        run: echo "VALIDATE_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          # Migration immutability validation compares against the PR merge
          # base and must never silently fall back to an editable ledger.
          fetch-depth: 0
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          no_cache: ${{ env.VALIDATE_NO_CACHE }}

      # Keep running sibling static checks after a failure (same as local
      # `npm run validate`), unless the job was cancelled.
      - name: ✨ Format
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: 🔍 Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: 🧠 Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: 🧾 Generated worker types
        if: ${{ !cancelled() }}
        run: npm run generate-types:check

      - name: 🏗️ Backup build
        if: ${{ !cancelled() }}
        run: npm run backup:build

      - name: 📟 Status build
        if: ${{ !cancelled() }}
        run: npm run status:build

      - name: 🧊 Nx cache build
        if: ${{ !cancelled() }}
        run: npm run nx-cache:build

      - name: 🗓️ Jobs build
        if: ${{ !cancelled() }}
        run: npm run jobs:build

      - name: 🏃 Runtime build
        if: ${{ !cancelled() }}
        run: npm run runtime:build

      - name: 🧱 Platform build
        if: ${{ !cancelled() }}
        run: npm run platform:build

      - name: 🖍️ Highlight build
        if: ${{ !cancelled() }}
        run: npm run highlight:build

      - name: 📮 Push queue build
        if: ${{ !cancelled() }}
        run: npm run push-queue:build

      - name: 🔌 API build
        if: ${{ !cancelled() }}
        run: npm run api:build

      - name: 📚 API docs build
        if: ${{ !cancelled() }}
        run: npm run api-docs:build

      - name: 🧪 Start release build
        if: ${{ !cancelled() }}
        env:
          KODY_START_RELEASE: ${{ github.sha }}
          KODY_VITE_OUTDIR: dist-start-release
        run: |
          npm exec --no -- vite build
          node tools/ci/verify-start-release-build.ts dist-start-release

      - name: 📦 Worker startup bundles
        if: ${{ !cancelled() }}
        env:
          # Main pushes may open/update a tracking issue when a reviewed
          # startup byte budget is exceeded. Overage never fails this step.
          GH_TOKEN: ${{ github.token }}
        run: npm run worker-startup-bundles:check

      - name: ⏱️ Worker startup time
        if: ${{ !cancelled() }}
        run: npm run worker-startup-time:check

      - name: 🚚 Origin production exports
        if: ${{ !cancelled() }}
        run: npm run origin-production-exports:check

      - name: 🧽 Slop ratchet
        if: ${{ !cancelled() }}
        run: npm run slop-ratchet:check

      - name: 🪓 Knip
        if: ${{ !cancelled() }}
        run: npm run knip

      - name: 🗺️ Primitives
        if: ${{ !cancelled() }}
        run: npm run primitives:check

      - name: 🗄️ Migrations
        if: ${{ !cancelled() }}
        run: npm run migrations:check
        env:
          # PRs trust the fetched base SHA; main pushes trust the pre-push SHA.
          # The validator rejects this value if it resolves to HEAD.
          MIGRATION_VALIDATION_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before || ''
            }}
          # Advisory open-PR migration prefix scan. Missing auth skips it and
          # does not fail this step.
          GH_TOKEN: ${{ github.token }}

      - name: 🔒 Lockfile peer drift
        if: ${{ !cancelled() }}
        run: npm run lockfile:check

      - name: 🛡️ Deploy guardrails
        if: ${{ !cancelled() }}
        run: npm run deploy-guardrails:check

      - name: 🧾 Workflow refs
        if: ${{ !cancelled() }}
        run: npm run workflows:check
        env:
          # PRs compare server.json to the fetched base SHA; main pushes
          # compare to the pre-push SHA so a multi-commit bump is one change.
          MCP_REGISTRY_VALIDATION_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before || ''
            }}

      - name: 📚 Docs (temporal)
        if: ${{ !cancelled() }}
        run: npm run docs:check-temporal

      - name: 📚 Docs (decisions)
        if: ${{ !cancelled() }}
        run: npm run docs:check-decisions

      - name: 📚 Docs (file refs)
        if: ${{ !cancelled() }}
        run: npm run docs:check-file-refs

      - name: 🧷 Skills lock
        if: ${{ !cancelled() }}
        run: npm run skills-lock:check

      - name: 📚 Docs (no hosted execute fallback)
        if: ${{ !cancelled() }}
        run: npm run docs:check-no-hosted-execute

      - name: 🧜 Mermaid
        if: ${{ !cancelled() }}
        run: npm run mermaid:check

      - name: 🩹 Dependency overrides
        if: ${{ !cancelled() }}
        run: npm run overrides:check

      - name: 🔐 Production dependency audit
        if: ${{ !cancelled() }}
        run: npm run audit:prod

      - name: ⏱️ Job wall-clock
        if: always() && !cancelled()
        run: |
          end=$(date +%s)
          start="${VALIDATE_JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          {
            echo "### Job wall-clock"
            echo "- job: static"
            echo "- runner: \`${RUNNER_NAME:-unknown}\`"
            echo "- no_cache: \`${VALIDATE_NO_CACHE}\`"
            echo "- duration_seconds: **${dur}**"
          } >> "$GITHUB_STEP_SUMMARY"

  node:
    runs-on:
      ${{ (inputs.runner != '' && inputs.runner != '(repo default)' &&
      inputs.runner) || vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🧪 Node
    timeout-minutes: 15
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      # Self-driving test-time budget (tools/ci/enforce-unit-job-budget.ts):
      # warn at watch 700s (~Node p95 + headroom); hard-fail at 840s on PRs
      # (under this job's 15m timeout). Cache hit or miss does not change
      # either threshold. Setup + tests both count; do not delete tests to
      # stay under.
      - name: ⏱️ Mark job start
        run: |
          epoch=$(date +%s)
          echo "UNIT_JOB_START_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "VALIDATE_JOB_START_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          # Node coverage includes migration immutability helpers that need a
          # trusted pre-change Git base (same as migrations:check).
          fetch-depth: 0
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          worker-env: 'true'
          no_cache: ${{ env.VALIDATE_NO_CACHE }}

      - name: 🧪 Node unit tests
        run: npm run test:node
        env:
          MIGRATION_VALIDATION_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before || ''
            }}

      - name: ⏱️ Unit job budget (watch 700s / hard 840s)
        if: success()
        # Watch warns always; hard fail on pull requests only. Advisory
        # (warning only) on push to main and manual dispatches so a slow
        # cold run cannot block deploy.
        run: >-
          node tools/ci/enforce-unit-job-budget.ts --leg node --start-epoch
          "$UNIT_JOB_START_EPOCH" ${{ github.event_name != 'pull_request' &&
          '--advisory' || '' }}

      - name: ⏱️ Job wall-clock
        if: always() && !cancelled()
        run: |
          end=$(date +%s)
          start="${VALIDATE_JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          {
            echo "### Job wall-clock"
            echo "- job: node"
            echo "- runner: \`${RUNNER_NAME:-unknown}\`"
            echo "- no_cache: \`${VALIDATE_NO_CACHE}\`"
            echo "- duration_seconds: **${dur}**"
          } >> "$GITHUB_STEP_SUMMARY"

  workers:
    runs-on:
      ${{ (inputs.runner != '' && inputs.runner != '(repo default)' &&
      inputs.runner) || vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: ☁️ Workers
    # Room for one ≤780s attempt + one retry + setup. Soft-capping the suite
    # below the job wall avoids workers=cancelled mid-suite (#3763).
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      # Self-driving attempt budget (tools/ci/enforce-unit-job-budget.ts):
      # each Workers suite attempt soft-caps at the hard ceiling (780s);
      # post-suite watch is 620s (~Workers p95 + headroom). Cache hit or miss
      # does not change either. Do not delete tests to stay under. A mid-suite
      # soft-cap hit retries once; assertion failures do not. On retry the
      # start epoch resets so the post-suite check measures the successful
      # attempt; overall job wall is the 30-minute timeout above.
      - name: ⏱️ Mark job start
        run: |
          epoch=$(date +%s)
          echo "UNIT_JOB_START_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "VALIDATE_JOB_START_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          worker-env: 'true'
          no_cache: ${{ env.VALIDATE_NO_CACHE }}

      # Soft-cap the first attempt at the remaining hard ceiling so a slow
      # runner cannot burn the whole job timeout and leave Validate as
      # workers=cancelled (#3763). GNU timeout exits 124 on soft-cap; exit
      # 137 is retryable only after the soft deadline (--kill-after SIGKILL).
      # Early SIGKILL before the deadline is not a budget timeout. Vitest
      # assertion failures keep their own non-zero status and never retry.
      # Keep ADR 0011 per-file isolation (do not disable isolate, warm DOs
      # from setupFiles, or skip verify).
      - name: ☁️ Workers unit tests
        run: |
          set -u
          attempt_budget_seconds=780
          kill_after_seconds=60
          now=$(date +%s)
          elapsed=$((now - UNIT_JOB_START_EPOCH))
          remaining=$((attempt_budget_seconds - elapsed))
          if [ "$remaining" -lt 60 ]; then
            remaining=60
          fi
          # No pipefail: the runner's implicit `bash -e` would abort on the
          # failing pipeline before the timeout check; PIPESTATUS captures
          # timeout/vitest's exit code instead.
          attempt_started=$(date +%s)
          timeout --signal=TERM --kill-after="${kill_after_seconds}s" "${remaining}s" \
            npm run test:workers 2>&1 | tee workers-attempt-1.log
          status=${PIPESTATUS[0]}
          attempt_elapsed=$(( $(date +%s) - attempt_started ))
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # 124 = soft-cap TERM. 137 = SIGKILL (128+9): retryable only once
          # the soft deadline has been reached (kill-after), not for an early
          # OS kill before the budget.
          retryable=0
          if [ "$status" -eq 124 ]; then
            retryable=1
          elif [ "$status" -eq 137 ] && [ "$attempt_elapsed" -ge "$remaining" ]; then
            retryable=1
          fi
          if [ "$retryable" -ne 1 ]; then
            exit "$status"
          fi
          echo "::warning::Workers unit hit the ≤${attempt_budget_seconds}s attempt budget mid-suite; retrying once (#3763)."
          # Measure the post-suite budget against the successful attempt only.
          echo "UNIT_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          # Capture under bash -e: a bare failing timeout would abort before
          # status=$? and skip the ::error:: annotation.
          attempt_started=$(date +%s)
          if timeout --signal=TERM --kill-after="${kill_after_seconds}s" "${attempt_budget_seconds}s" \
            npm run test:workers; then
            status=0
          else
            status=$?
          fi
          attempt_elapsed=$(( $(date +%s) - attempt_started ))
          retry_timeout=0
          if [ "$status" -eq 124 ]; then
            retry_timeout=1
          elif [ "$status" -eq 137 ] && [ "$attempt_elapsed" -ge "$attempt_budget_seconds" ]; then
            retry_timeout=1
          fi
          if [ "$retry_timeout" -eq 1 ]; then
            echo "::error::Workers unit exceeded ≤${attempt_budget_seconds}s on retry (#3763)."
            exit "$status"
          fi
          exit "$status"

      - name: ⏱️ Unit job budget (watch 620s / hard 780s)
        if: success()
        # Watch warns always; hard fail on pull requests only. Advisory
        # (warning only) on push to main and manual dispatches so a slow
        # cold run cannot block deploy.
        run: >-
          node tools/ci/enforce-unit-job-budget.ts --leg workers --start-epoch
          "$UNIT_JOB_START_EPOCH" ${{ github.event_name != 'pull_request' &&
          '--advisory' || '' }}

      - name: ⏱️ Job wall-clock
        if: always() && !cancelled()
        run: |
          end=$(date +%s)
          start="${VALIDATE_JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          {
            echo "### Job wall-clock"
            echo "- job: workers"
            echo "- runner: \`${RUNNER_NAME:-unknown}\`"
            echo "- no_cache: \`${VALIDATE_NO_CACHE}\`"
            echo "- duration_seconds: **${dur}**"
          } >> "$GITHUB_STEP_SUMMARY"

  mcp:
    runs-on:
      ${{ (inputs.runner != '' && inputs.runner != '(repo default)' &&
      inputs.runner) || vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🔌 MCP
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: ⏱️ Mark job start
        run: echo "VALIDATE_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          worker-env: 'true'
          no_cache: ${{ env.VALIDATE_NO_CACHE }}

      - name: 🔌 MCP E2E
        run: npm run test:mcp

      - name: ⏱️ Job wall-clock
        if: always() && !cancelled()
        run: |
          end=$(date +%s)
          start="${VALIDATE_JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          {
            echo "### Job wall-clock"
            echo "- job: mcp"
            echo "- runner: \`${RUNNER_NAME:-unknown}\`"
            echo "- no_cache: \`${VALIDATE_NO_CACHE}\`"
            echo "- duration_seconds: **${dur}**"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on:
      ${{ (inputs.runner != '' && inputs.runner != '(repo default)' &&
      inputs.runner) || vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🎭 E2E (${{ matrix.shard }}/4)
    # Each shard owns its own runner (and D1 file), so shards never share
    # SQLITE_BUSY. Keep workers: 1 inside a shard (playwright.config.ts).
    # N=4 balances wall-clock (~18–21m serial E2E → ~shard_max) against
    # repeated setup/build cost; see PR body for measured timings.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Room for one shard (~setup + ~¼ suite) plus one permitted workerd-crash
    # retry. Serial E2E was 40m; shards should finish well under that.
    timeout-minutes: 25
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: ⏱️ Mark job start
        run: echo "VALIDATE_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          playwright: 'true'
          worker-env: 'true'
          no_cache: ${{ env.VALIDATE_NO_CACHE }}

      # Wrangler's local workerd occasionally crashes mid-suite ("Broken
      # pipe" → "Network connection lost"), which kills the Playwright
      # webServer and fails every remaining test with ECONNREFUSED /
      # E2eWebServerDeadError (see e2e/web-server-liveness.ts). Vite +
      # @cloudflare/vite-plugin can also die on first start with
      # `ReferenceError: __LOAD__ is not defined` during live export-type
      # inspection (Validate #36669175020), or restart workerd after
      # "The Workers runtime crashed unexpectedly" while the webServer
      # process stays up (Validate #38206666510). Retry the whole shard
      # once with a fresh server, but only when the failure matches that
      # crash signature — genuine test failures never retry.
      # --skipNxCache: shard CLI args must not reuse another shard's
      # cached test-e2e success (run-commands may not hash forwarded args).
      - name: 🎭 Playwright E2E
        run: |
          # No pipefail: the runner's implicit `bash -e` would abort on the
          # failing pipeline before the flake check; PIPESTATUS captures the
          # suite's exit code instead.
          set -u
          shard="${{ matrix.shard }}/4"
          node tools/run-nx.ts run worker:test-e2e --skipNxCache -- --shard="$shard" 2>&1 | tee e2e-attempt-1.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if ! node tools/ci/retry-classifiers.ts e2e e2e-attempt-1.log; then
            exit "$status"
          fi
          echo "::warning::Playwright webServer died on start or mid-suite; retrying shard ${shard} once with a fresh server."
          node tools/run-nx.ts run worker:test-e2e --skipNxCache -- --shard="$shard"

      - name: 📤 Upload Playwright blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 14

      # Wrangler writes fatal mid-suite exits under WRANGLER_LOG_PATH
      # (./logs.local). Upload on failure so empty `[WebServer] ERROR` lines
      # in the job log are diagnosable (see e2e/web-server-liveness.ts).
      - name: 📤 Upload Wrangler e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-wrangler-logs-${{ matrix.shard }}
          path: logs.local/
          if-no-files-found: ignore
          retention-days: 14

      - name: ⏱️ Job wall-clock
        if: always() && !cancelled()
        run: |
          end=$(date +%s)
          start="${VALIDATE_JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          {
            echo "### Job wall-clock"
            echo "- job: e2e-${{ matrix.shard }}/4"
            echo "- runner: \`${RUNNER_NAME:-unknown}\`"
            echo "- no_cache: \`${VALIDATE_NO_CACHE}\`"
            echo "- duration_seconds: **${dur}**"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e_report:
    runs-on: ubuntu-latest
    name: 🎭 E2E Report
    timeout-minutes: 10
    needs:
      - e2e
    # Merge shard blob reports even when some shards failed so the HTML
    # artifact stays readable. Skip when the matrix was skipped (draft PR)
    # or the whole run was cancelled.
    if: >-
      always() && !cancelled() && needs.e2e.result != 'skipped' &&
      (github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false)
    permissions:
      contents: read
      actions: read
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 📥 Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-report-*
          path: all-blob-reports
          merge-multiple: true
          if-no-files-found: ignore

      - name: 🧩 Merge Playwright reports
        run: |
          set -u
          if [ ! -d all-blob-reports ] || [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "::warning::No Playwright blob reports found to merge."
            mkdir -p playwright-report
            echo "<p>No blob reports were uploaded from E2E shards.</p>" > playwright-report/index.html
            exit 0
          fi
          npx playwright merge-reports --reporter html ./all-blob-reports

      - name: 📤 Upload merged HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

  cli:
    runs-on:
      ${{ (inputs.runner != '' && inputs.runner != '(repo default)' &&
      inputs.runner) || vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🧰 CLI
    timeout-minutes: 20
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.draft ==
      false
    steps:
      - name: ⏱️ Mark job start
        run: echo "VALIDATE_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🧰 Setup
        uses: ./.github/actions/setup-validate
        with:
          no_cache: ${{ env.VALIDATE_NO_CACHE }}

      - name: 🔌 OpenAPI client check
        run: npm run cli:openapi:check

      - name: 🧪 CLI validate
        run: npm run cli:validate

      - name: ⏱️ Job wall-clock
        if: always() && !cancelled()
        run: |
          end=$(date +%s)
          start="${VALIDATE_JOB_START_EPOCH:-$end}"
          dur=$((end - start))
          {
            echo "### Job wall-clock"
            echo "- job: cli"
            echo "- runner: \`${RUNNER_NAME:-unknown}\`"
            echo "- no_cache: \`${VALIDATE_NO_CACHE}\`"
            echo "- duration_seconds: **${dur}**"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    # Final merge gate stays on GitHub-hosted ubuntu-latest so a green
    # ✅ Validate check does not wait on a Warp machine (~10s) for a 3–4s job.
    runs-on: ubuntu-latest
    name: ✅ Validate
    timeout-minutes: 2
    needs:
      - static
      - node
      - workers
      - mcp
      - e2e
      - e2e_report
      - cli
    permissions:
      contents: read
      actions: read
    # always() so a failed sibling still reports; !cancelled() so a
    # superseded run (cancel-in-progress) does not paint ✅ Validate red.
    # A sibling job timeout still fails this job: the workflow is not
    # cancelled, and that child result is cancelled != success.
    if: >-
      always() && !cancelled() && (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false)
    steps:
      - name: ⏱️ Run wall-clock summary
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p validate-timings
          {
            echo "## Validate wall-clock"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- no_cache: \`${VALIDATE_NO_CACHE}\`"
            echo "- runner: \`${VALIDATE_RUNNER}\`"
            echo "- iteration: \`${VALIDATE_ITERATION}\`"
            echo "- run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- sha: \`${{ github.sha }}\`"
            echo
            echo "| Job | Conclusion | Duration |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Prefer Actions API timings (started_at/completed_at) so the gate
          # job can total siblings without artifacts.
          # Paginate: a 5-iteration bench with sharded E2E exceeds the default
          # 30-job page, and later iterations would otherwise steal earlier
          # timings. `--jq '.jobs[]'` + `jq -s` rebuilds one object because
          # raw `--paginate` concatenates page objects and breaks json.loads.
          JOBS_JSON=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '.jobs[]' | jq -s '{jobs: .}')
          export JOBS_JSON
          export VALIDATE_NO_CACHE VALIDATE_RUNNER VALIDATE_ITERATION
          export GITHUB_SHA='${{ github.sha }}'
          export GITHUB_RUN_ID='${{ github.run_id }}'
          export GITHUB_RUN_URL='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          # Heredoc body must share the run-script indent so YAML dedent leaves
          # valid top-level Python (no leading spaces inside the script).
          python3 <<'PY'
          import csv, json, os
          from datetime import datetime, timezone

          def parse(ts):
              if not ts:
                  return None
              return datetime.fromisoformat(ts.replace("Z", "+00:00"))

          def main():
              payload = json.loads(os.environ["JOBS_JSON"])
              jobs = payload.get("jobs", [])
              # Sharded E2E jobs are named "🎭 E2E (1/4)" … "🎭 E2E (4/4)" (or
              # nested under validate-bench). Match any job whose leaf starts
              # with "🎭 E2E (" so timings stay accurate after the split.
              e2e_prefix = "🎭 E2E ("

              def find_job(leaf):
                  # Direct Validate runs use the bare job name. Reusable calls
                  # from validate-bench nest as "{caller} / {leaf}". When
                  # several iterations share a run, prefer the most recently
                  # started match.
                  exact = [j for j in jobs if j.get("name") == leaf]
                  if exact:
                      return exact[0]
                  nested = [
                      j
                      for j in jobs
                      if (j.get("name") or "").endswith(f" / {leaf}")
                  ]
                  if not nested:
                      return None
                  nested.sort(
                      key=lambda j: j.get("started_at") or "", reverse=True
                  )
                  return nested[0]

              # Prefer the caller prefix from a non-E2E leaf so multi-iteration
              # validate-bench runs only count this invocation's shards.
              caller_prefix = None
              for probe in ("🧹 Static", "🧪 Node", "☁️ Workers", "🔌 MCP", "🧰 CLI"):
                  probed = find_job(probe)
                  if not probed:
                      continue
                  name = probed.get("name") or ""
                  if " / " in name:
                      caller_prefix = name.rsplit(" / ", 1)[0]
                      break

              def find_e2e_jobs():
                  matched = []
                  for job in jobs:
                      name = job.get("name") or ""
                      if caller_prefix is not None:
                          if not name.startswith(f"{caller_prefix} / "):
                              continue
                          leaf = name[len(caller_prefix) + 3 :]
                      else:
                          if " / " in name:
                              continue
                          leaf = name
                      if leaf.startswith(e2e_prefix):
                          matched.append(job)
                  matched.sort(key=lambda j: j.get("name") or "")
                  return matched

              rows = []
              total = 0
              earliest = None
              latest = None
              summary_lines = []

              def append_job_row(name, job):
                  nonlocal total, earliest, latest
                  if not job:
                      summary_lines.append(f"| {name} | missing | — |")
                      rows.append(
                          {
                              "job": name,
                              "conclusion": "missing",
                              "duration_seconds": None,
                              "runner_name": None,
                              "labels": [],
                          }
                      )
                      return
                  start = parse(job.get("started_at"))
                  end = parse(job.get("completed_at"))
                  conclusion = job.get("conclusion") or job.get("status") or "?"
                  labels = job.get("labels") or []
                  runner_name = job.get("runner_name") or None
                  if start and end:
                      dur = int((end - start).total_seconds())
                      total += dur
                      earliest = (
                          start if earliest is None or start < earliest else earliest
                      )
                      latest = end if latest is None or end > latest else latest
                      summary_lines.append(f"| {name} | {conclusion} | {dur}s |")
                  else:
                      dur = None
                      summary_lines.append(f"| {name} | {conclusion} | — |")
                  rows.append(
                      {
                          "job": name,
                          "conclusion": conclusion,
                          "duration_seconds": dur,
                          "runner_name": runner_name,
                          "labels": labels,
                          "started_at": job.get("started_at"),
                          "completed_at": job.get("completed_at"),
                      }
                  )

              for name in ("🧹 Static", "🧪 Node", "☁️ Workers", "🔌 MCP"):
                  append_job_row(name, find_job(name))
              e2e_jobs = find_e2e_jobs()
              if e2e_jobs:
                  for job in e2e_jobs:
                      leaf = (job.get("name") or "").split(" / ")[-1]
                      append_job_row(leaf, job)
              else:
                  append_job_row("🎭 E2E", None)
              for name in ("🎭 E2E Report", "🧰 CLI"):
                  append_job_row(name, find_job(name))
              wall = (
                  int((latest - earliest).total_seconds())
                  if earliest and latest
                  else total
              )
              summary_lines.extend(
                  [
                      "",
                      f"- **sum of job durations:** {total}s",
                      f"- **wall-clock (earliest start → latest end):** {wall}s",
                  ]
              )
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write("\n".join(summary_lines) + "\n")

              report = {
                  "schema": "kody.validate-timings.v1",
                  "recorded_at": datetime.now(timezone.utc).isoformat(),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_url": os.environ.get("GITHUB_RUN_URL"),
                  "sha": os.environ.get("GITHUB_SHA"),
                  "no_cache": os.environ.get("VALIDATE_NO_CACHE") == "true",
                  "runner": os.environ.get("VALIDATE_RUNNER"),
                  "iteration": int(float(os.environ.get("VALIDATE_ITERATION") or "0")),
                  "sum_job_duration_seconds": total,
                  "wall_clock_seconds": wall,
                  "jobs": rows,
              }
              out_dir = "validate-timings"
              json_path = os.path.join(out_dir, "timings.json")
              csv_path = os.path.join(out_dir, "timings.csv")
              with open(json_path, "w", encoding="utf-8") as fh:
                  json.dump(report, fh, indent=2)
                  fh.write("\n")
              with open(csv_path, "w", encoding="utf-8", newline="") as fh:
                  writer = csv.DictWriter(
                      fh,
                      fieldnames=[
                          "job",
                          "conclusion",
                          "duration_seconds",
                          "runner_name",
                          "labels",
                          "started_at",
                          "completed_at",
                      ],
                  )
                  writer.writeheader()
                  for row in rows:
                      writer.writerow(
                          {
                              **row,
                              "labels": ",".join(row.get("labels") or []),
                          }
                      )
              print(json.dumps({"sum": total, "wall": wall, "jobs": len(rows)}))

          main()

          PY

      - name: 📤 Upload timing artifact
        # Bench / no_cache dispatches only — keep normal push/PR runs quiet.
        if: always() && !cancelled() && env.VALIDATE_NO_CACHE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: >-
            validate-timings-${{ env.VALIDATE_RUNNER }}-nocache-${{
            env.VALIDATE_NO_CACHE }}-iter-${{ env.VALIDATE_ITERATION }}-run-${{
            github.run_id }}
          path: validate-timings/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      - name: ✅ All checks passed
        if: >-
          needs.static.result == 'success' && needs.node.result == 'success' &&
          needs.workers.result == 'success' && needs.mcp.result == 'success' &&
          needs.e2e.result == 'success' && needs.e2e_report.result == 'success'
          && needs.cli.result == 'success'
        run: echo "All validate jobs passed"

      - name: ❌ Report failures
        if: >-
          needs.static.result != 'success' || needs.node.result != 'success' ||
          needs.workers.result != 'success' || needs.mcp.result != 'success' ||
          needs.e2e.result != 'success' || needs.e2e_report.result != 'success'
          || needs.cli.result != 'success'
        run: |
          echo "static=${{ needs.static.result }}"
          echo "node=${{ needs.node.result }}"
          echo "workers=${{ needs.workers.result }}"
          echo "mcp=${{ needs.mcp.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "e2e_report=${{ needs.e2e_report.result }}"
          echo "cli=${{ needs.cli.result }}"
          exit 1
