name: 🚀 Deploy (production)

on:
  workflow_run:
    workflows:
      - '✅ Validate'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Production deployment or inactive Start opt-in preparation
        type: choice
        options:
          - production
          - prepare-start-opt-in
          - deploy-start-opt-in
          - activate-start-opt-in
          - verify-start-opt-in
          - rollback-start-opt-in
        default: production
      start_release:
        description:
          Full reviewed PR 3561 source SHA, required for opt-in preparation
        type: string
        default: ''
      start_evidence_run:
        description:
          For activation, an inactive verification run, for rollback, the
          activation receipt run
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  deployments: write
  pull-requests: read

# Queue rather than cancel: the job runs D1 migrations before the worker
# uploads and deploys platform before runtime, so cancelling mid-sequence
# leaves new schema with old code or mismatched Durable Object bindings.
# GitHub keeps at most one pending run per group and replaces it with a newer
# one; that is intended, because Validate on `main` completes in push order and
# the replacement targets a newer commit, so dropping the older one only skips
# an intermediate deploy (sha-guard never moves production backwards).
# Runs that sha-guard would skip (failed, cancelled, or non-push Validate
# completions, and off-main dispatches) get their own group so they cannot
# replace a pending deploy.
concurrency:
  group: >-
    ${{ ((github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    && inputs.mode == 'production') || (github.event.workflow_run.conclusion ==
    'success' && github.event.workflow_run.head_branch == 'main' &&
    github.event.workflow_run.event == 'push')) && 'deploy-production' ||
    ((github.event_name == 'workflow_dispatch' && github.ref_name ==
    'taren/tanstack-start-migration' && (inputs.mode == 'prepare-start-opt-in'
    || inputs.mode == 'deploy-start-opt-in' || inputs.mode ==
    'activate-start-opt-in' || inputs.mode == 'verify-start-opt-in' ||
    inputs.mode == 'rollback-start-opt-in')) && 'deploy-start-opt-in' ||
    format('deploy-skipped-{0}', github.run_id)) }}
  cancel-in-progress: false

jobs:
  prepare-start-opt-in:
    name: Prepare inactive Start opt-in release
    if: >-
      github.event_name == 'workflow_dispatch' && (inputs.mode ==
      'prepare-start-opt-in' || inputs.mode == 'deploy-start-opt-in') &&
      github.ref == 'refs/heads/taren/tanstack-start-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      KODY_START_RELEASE: ${{ inputs.start_release }}
    steps:
      - name: Verify pinned PR head and successful validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          const release = process.env.KODY_START_RELEASE
          if (!/^[a-f0-9]{40}$/.test(release) || release !== process.env.DISPATCH_SHA) throw new Error('Dispatch must pin its exact reviewed branch head')
          const api = async (url) => {
            const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/${url}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } })
            if (!response.ok) throw new Error(`GitHub verification failed: ${response.status}`)
            return response.json()
          }
          const pr = await api('pulls/3561')
          if (pr.state !== 'open' || pr.head.sha !== release || pr.head.ref !== 'taren/tanstack-start-migration' || pr.head.repo.full_name !== process.env.REPOSITORY) throw new Error('Pinned release is not the open migration PR head')
          const runs = await api(`actions/runs?head_sha=${release}&per_page=100`)
          const validate = runs.workflow_runs.filter(run => run.name === '✅ Validate' && run.head_sha === release).sort((a, b) => b.id - a.id)[0]
          if (!validate || validate.status !== 'completed' || validate.conclusion !== 'success') throw new Error('Latest Validate for the exact source SHA must pass before production settings are read')
          JS
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.start_release }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Read existing production bindings and approved account IDs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ci/prepare-start-opt-in.ts snapshot
      - name: Build pinned isolated release
        env:
          KODY_WRANGLER_CONFIG: packages/worker/wrangler-start.generated.json
          CLOUDFLARE_ENV: production
        run: |
          cp packages/worker/.env.example packages/worker/.env
          npx --no-install vite build
          node tools/framework-comparison/verify-redact-build.mjs dist
          node tools/ci/verify-start-release-build.ts dist
          node tools/ci/prepare-start-opt-in.ts finalize
      - name: Deploy inactive isolated workers with trusted production secrets
        if: inputs.mode == 'deploy-start-opt-in'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_APP_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_API_TOKEN }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          SECRET_STORE_KEY: ${{ secrets.SECRET_STORE_KEY }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CAPABILITY_REINDEX_SECRET: ${{ secrets.CAPABILITY_REINDEX_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.OAUTH_X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.OAUTH_X_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.OAUTH_DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.OAUTH_DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_MEMBER_ROLE_ID: ${{ secrets.DISCORD_MEMBER_ROLE_ID }}
          DISCORD_STANDARD_ROLE_ID: ${{ secrets.DISCORD_STANDARD_ROLE_ID }}
          DISCORD_PRO_ROLE_ID: ${{ secrets.DISCORD_PRO_ROLE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STATUS_INCIDENT_EVENT_SECRET:
            ${{ secrets.STATUS_INCIDENT_EVENT_SECRET }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          OIDC_SIGNING_PRIVATE_KEY_PEM:
            ${{ secrets.OIDC_SIGNING_PRIVATE_KEY_PEM }}
          OIDC_SIGNING_KEY_ID: ${{ secrets.OIDC_SIGNING_KEY_ID }}
          CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN:
            ${{ secrets.CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN }}
          PACKAGE_APP_TICKET_KEYS: ${{ secrets.PACKAGE_APP_TICKET_KEYS }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: node tools/ci/deploy-start-opt-in.ts
      - name: Verify inactive workers through a private remote session
        if:
          inputs.mode == 'deploy-start-opt-in' || inputs.mode ==
          'verify-start-opt-in'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ci/probe-start-opt-in.ts
      - name: Upload inactive review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-opt-in-${{ inputs.start_release }}
          path: |
            .tmp/start-opt-in/review.json
            .tmp/start-opt-in/router.json
            packages/start-routing-worker/start-entry.generated.ts
            .tmp/start-opt-in/deployed.json
            .tmp/start-opt-in/controller.json
            .tmp/start-opt-in/runtime-proof.json
            .tmp/start-opt-in/secret-names.json
            dist
          include-hidden-files: true
          retention-days: 3
      # Preparation never deploys. Inactive deployment is an explicit mode,
      # and neither mode can activate a zone route or replace a live worker.
  verify-start-opt-in:
    name: Verify existing inactive Start release
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode ==
      'verify-start-opt-in' && github.ref ==
      'refs/heads/taren/tanstack-start-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      KODY_START_RELEASE: ${{ inputs.start_release }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Verify current controller and successful target deployment step
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.start_evidence_run }}
        run: node tools/ci/start-opt-in-evidence.ts deployment
      - uses: actions/download-artifact@v4
        with:
          name: start-opt-in-${{ inputs.start_release }}
          run-id: ${{ inputs.start_evidence_run }}
          github-token: ${{ github.token }}
          path: .tmp/start-opt-in/download
      - name: Select immutable deployed target bundle
        run: |
          cp .tmp/start-opt-in/download/.tmp/start-opt-in/review.json .tmp/start-opt-in/review.json
          cp .tmp/start-opt-in/download/.tmp/start-opt-in/deployed.json .tmp/start-opt-in/deployed.json
          cp -R .tmp/start-opt-in/download/dist ./dist
      - name: Verify exact inactive receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.start_evidence_run }}
        run: node tools/ci/start-opt-in-evidence.ts receipt
      - name: Verify inactive workers through corrected private probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ci/probe-start-opt-in.ts
      - name: Retain verified target and controller provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-opt-in-${{ inputs.start_release }}
          path: |
            .tmp/start-opt-in/review.json
            .tmp/start-opt-in/deployed.json
            .tmp/start-opt-in/controller.json
            .tmp/start-opt-in/runtime-proof.json
          include-hidden-files: true
          retention-days: 3
  activate-start-opt-in:
    name: Activate reviewed two-account Start opt-in route
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode ==
      'activate-start-opt-in' && github.ref ==
      'refs/heads/taren/tanstack-start-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      KODY_START_RELEASE: ${{ inputs.start_release }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Verify current controller and target evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.start_evidence_run }}
        run: node tools/ci/start-opt-in-evidence.ts verification
      - uses: actions/download-artifact@v4
        with:
          name: start-opt-in-${{ inputs.start_release }}
          run-id: ${{ inputs.start_evidence_run }}
          github-token: ${{ github.token }}
          path: .tmp/start-opt-in/download
      - name: Select exact reviewed evidence files
        run: |
          if [ "${{ steps.evidence.outputs.layout }}" = "nested" ]; then
            evidence_dir=.tmp/start-opt-in/download/.tmp/start-opt-in
          elif [ "${{ steps.evidence.outputs.layout }}" = "flat" ]; then
            evidence_dir=.tmp/start-opt-in/download
          else
            exit 1
          fi
          cp "$evidence_dir/review.json" .tmp/start-opt-in/review.json
          cp "$evidence_dir/runtime-proof.json" .tmp/start-opt-in/runtime-proof.json
          cp "$evidence_dir/controller.json" .tmp/start-opt-in/controller.json
          cp "$evidence_dir/deployed.json" .tmp/start-opt-in/deployed.json
      - name: Verify target receipt and controller provenance
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.start_evidence_run }}
        run: node tools/ci/start-opt-in-evidence.ts proof
      - name: Activate only the reviewed zone route overlay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node tools/ci/start-opt-in-routing.ts activate
      - name: Retain exact rollback receipt even after a verification failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-opt-in-route-${{ inputs.start_release }}
          path: .tmp/start-opt-in/route-receipt.json
          include-hidden-files: true
          retention-days: 30
  rollback-start-opt-in:
    name: Remove only the recorded Start opt-in overlay
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode ==
      'rollback-start-opt-in' && github.ref ==
      'refs/heads/taren/tanstack-start-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      KODY_START_RELEASE: ${{ inputs.start_release }}
    steps:
      - name: Verify activation receipt provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN: ${{ inputs.start_evidence_run }}
        run: |
          node --input-type=module <<'JS'
          const release = process.env.KODY_START_RELEASE
          if (!/^[a-f0-9]{40}$/.test(release) || !/^[0-9]+$/.test(process.env.EVIDENCE_RUN)) throw new Error('Pinned target release and activation receipt run ID required')
          const response = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/actions/runs/${process.env.EVIDENCE_RUN}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } })
          if (!response.ok) throw new Error(`Receipt verification failed: ${response.status}`)
          const evidence = await response.json()
          if (!/^[a-f0-9]{40}$/.test(evidence.head_sha) || evidence.status !== 'completed' || evidence.event !== 'workflow_dispatch' || evidence.path !== '.github/workflows/deploy.yml' || evidence.head_branch !== 'taren/tanstack-start-migration' || evidence.repository?.full_name !== process.env.REPOSITORY) throw new Error('Receipt must come from the trusted completed activation workflow')
          const jobsResponse = await fetch(`https://api.github.com/repos/${process.env.REPOSITORY}/actions/runs/${process.env.EVIDENCE_RUN}/jobs?per_page=100`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' } })
          if (!jobsResponse.ok) throw new Error(`Activation job verification failed: ${jobsResponse.status}`)
          const jobs = await jobsResponse.json()
          const activation = jobs.jobs?.filter(job => job.name === 'Activate reviewed two-account Start opt-in route')
          if (activation?.length !== 1 || !activation[0].steps?.some(step => step.name === 'Activate only the reviewed zone route overlay' && ['success', 'failure', 'cancelled', 'timed_out'].includes(step.conclusion))) throw new Error('Receipt must come from an executed activation step')
          // The run pins controller code. The downloaded receipt pins the target release.
          JS
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: start-opt-in-route-${{ inputs.start_release }}
          run-id: ${{ inputs.start_evidence_run }}
          github-token: ${{ github.token }}
          path: .tmp/start-opt-in/rollback-download
      - name: Select and verify the captured route receipt
        run: |
          cp .tmp/start-opt-in/rollback-download/route-receipt.json .tmp/start-opt-in/route-receipt.json
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises'
          const receipt = JSON.parse(await readFile('.tmp/start-opt-in/route-receipt.json', 'utf8'))
          if (receipt.release !== process.env.KODY_START_RELEASE) throw new Error('Receipt target release does not match the requested rollback release')
          JS
      - name: Delete only the exact recorded rollout zone route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node tools/ci/start-opt-in-routing.ts rollback
      - name: Retain rollback result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: start-opt-in-rollback-${{ inputs.start_release }}
          path: .tmp/start-opt-in/route-receipt.json
          include-hidden-files: true
          retention-days: 30
  sha-guard:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🧾 Production deploy guard
    timeout-minutes: 4
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' &&
      inputs.mode == 'production')
    outputs:
      deploy_sha: ${{ steps.sha_guard.outputs.deploy_sha }}
      should_deploy: ${{ steps.sha_guard.outputs.should_deploy }}
      deploy_main: ${{ steps.sha_guard.outputs.deploy_main }}
      deploy_platform: ${{ steps.sha_guard.outputs.deploy_platform }}
      deploy_runtime: ${{ steps.sha_guard.outputs.deploy_runtime }}
      deploy_jobs: ${{ steps.sha_guard.outputs.deploy_jobs }}
      deploy_highlight: ${{ steps.sha_guard.outputs.deploy_highlight }}
      deploy_push_queue: ${{ steps.sha_guard.outputs.deploy_push_queue }}
      deploy_backup_control_plane:
        ${{ steps.sha_guard.outputs.deploy_backup_control_plane }}
      deploy_status_worker: ${{ steps.sha_guard.outputs.deploy_status_worker }}
      deploy_api_worker: ${{ steps.sha_guard.outputs.deploy_api_worker }}
      deploy_api_docs_worker:
        ${{ steps.sha_guard.outputs.deploy_api_docs_worker }}
      deploy_nx_cache_worker:
        ${{ steps.sha_guard.outputs.deploy_nx_cache_worker }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref:
            ${{ github.event_name == 'workflow_dispatch' && github.sha ||
            github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: 🧾 Resolve deploy SHA and ensure production moves forward
        id: sha_guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_DISPATCH_SHA: ${{ github.sha }}
          PRODUCTION_URL: ${{ vars.APP_BASE_URL || 'https://kody.codes' }}
        run: |
          set -euo pipefail
          DEPLOY_SHA="$WORKFLOW_RUN_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_SHA="$WORKFLOW_DISPATCH_SHA"
          fi

          if [ -z "$DEPLOY_SHA" ]; then
            echo "Unable to resolve deploy SHA for event: $EVENT_NAME" >&2
            exit 1
          fi

          git fetch origin main
          HEAD_SHA="$(git rev-parse origin/main)"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          # main HEAD, or an older validated main commit when production is
          # strictly behind it (tools/ci/deploy-sha-guard.ts).
          # Commits validated before the guard landed lack the script; they
          # keep the HEAD-only rule.
          if [ -f tools/ci/deploy-sha-guard.ts ]; then
            GUARD_OUTPUT="$(DEPLOY_SHA="$DEPLOY_SHA" HEAD_SHA="$HEAD_SHA" node tools/ci/deploy-sha-guard.ts)"
          elif [ "$HEAD_SHA" = "$DEPLOY_SHA" ]; then
            GUARD_OUTPUT="should_deploy=true"
          else
            GUARD_OUTPUT="should_deploy=false"
            echo "Skipping deploy: $DEPLOY_SHA predates deploy-sha-guard.ts and is not main HEAD $HEAD_SHA."
          fi
          if [ "$GUARD_OUTPUT" != "should_deploy=true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "deploy_main=false" >> "$GITHUB_OUTPUT"
            echo "deploy_platform=false" >> "$GITHUB_OUTPUT"
            echo "deploy_runtime=false" >> "$GITHUB_OUTPUT"
            echo "deploy_jobs=false" >> "$GITHUB_OUTPUT"
            echo "deploy_highlight=false" >> "$GITHUB_OUTPUT"
            echo "deploy_push_queue=false" >> "$GITHUB_OUTPUT"
            echo "deploy_backup_control_plane=false" >> "$GITHUB_OUTPUT"
            echo "deploy_status_worker=false" >> "$GITHUB_OUTPUT"
            echo "deploy_api_worker=false" >> "$GITHUB_OUTPUT"
            echo "deploy_api_docs_worker=false" >> "$GITHUB_OUTPUT"
            echo "deploy_nx_cache_worker=false" >> "$GITHUB_OUTPUT"
            echo "target=$DEPLOY_SHA"
            echo "head=$HEAD_SHA"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

          # Always redeploy the DR control plane and status worker on manual
          # workflow_dispatch. On push-driven deploys, path-filter against a
          # short ancestor window (not tip^..tip alone): a cancelled Validate
          # on an intermediate main commit (e.g. squash-merge raced by the
          # next merge) would otherwise skip optional workers forever, because
          # the later tip's single-commit diff no longer lists those paths
          # even though the tip tree contains them (#2436 seal window after
          # #2438).
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy_main=true" >> "$GITHUB_OUTPUT"
            echo "deploy_platform=true" >> "$GITHUB_OUTPUT"
            echo "deploy_runtime=true" >> "$GITHUB_OUTPUT"
            echo "deploy_jobs=true" >> "$GITHUB_OUTPUT"
            echo "deploy_highlight=true" >> "$GITHUB_OUTPUT"
            echo "deploy_push_queue=true" >> "$GITHUB_OUTPUT"
            echo "deploy_backup_control_plane=true" >> "$GITHUB_OUTPUT"
            echo "deploy_status_worker=true" >> "$GITHUB_OUTPUT"
            echo "deploy_api_worker=true" >> "$GITHUB_OUTPUT"
            echo "deploy_api_docs_worker=true" >> "$GITHUB_OUTPUT"
            echo "deploy_nx_cache_worker=true" >> "$GITHUB_OUTPUT"
            echo "Backup control plane deploy: forced (workflow_dispatch)."
            echo "Status worker deploy: forced (workflow_dispatch)."
            echo "API worker deploy: forced (workflow_dispatch)."
            echo "API docs worker deploy: forced (workflow_dispatch)."
            echo "Nx cache worker deploy: forced (workflow_dispatch)."
            exit 0
          fi

          PATH_FILTER_LOOKBACK=15
          if git rev-parse --verify "${DEPLOY_SHA}~${PATH_FILTER_LOOKBACK}" >/dev/null 2>&1; then
            PATH_FILTER_BASE="${DEPLOY_SHA}~${PATH_FILTER_LOOKBACK}"
          else
            PATH_FILTER_BASE="$(git rev-list --max-parents=0 -n1 "${DEPLOY_SHA}")"
          fi
          echo "Path filter range: ${PATH_FILTER_BASE}..${DEPLOY_SHA}"

          # Union of paths touched by any commit in the window (not tip-tree
          # net diff). An A→B→A revert still lists the path so production is
          # forced back onto the tip binary.
          PATH_FILTER_LIST="$(mktemp)"
          git log --name-only --pretty=format: "${PATH_FILTER_BASE}..${DEPLOY_SHA}" |
            sed '/^$/d' |
            sort -u >"$PATH_FILTER_LIST"
          echo "Path filter paths ($(wc -l <"$PATH_FILTER_LIST") unique):"
          head -n 40 "$PATH_FILTER_LIST"

          node tools/ci/deploy-path-filter.ts <"$PATH_FILTER_LIST" | tee -a "$GITHUB_OUTPUT"

          if grep -E \
            '^(\.github/workflows/deploy\.yml|tools/ci/backup-resources|packages/backup-control-plane/|packages/shared/src/backup-)' \
            "$PATH_FILTER_LIST" >/dev/null; then
            echo "deploy_backup_control_plane=true" >> "$GITHUB_OUTPUT"
            echo "Backup control plane deploy: path filter matched."
          else
            echo "deploy_backup_control_plane=false" >> "$GITHUB_OUTPUT"
            echo "Backup control plane deploy: skipped (no relevant path changes)."
          fi

          if grep -E \
            '^(\.github/workflows/deploy\.yml|packages/status/)' \
            "$PATH_FILTER_LIST" >/dev/null; then
            echo "deploy_status_worker=true" >> "$GITHUB_OUTPUT"
            echo "Status worker deploy: path filter matched."
          else
            echo "deploy_status_worker=false" >> "$GITHUB_OUTPUT"
            echo "Status worker deploy: skipped (no relevant path changes)."
          fi

          if grep -E \
            '^(\.github/workflows/deploy\.yml|packages/api-worker/|packages/shared/src/(api-token-format|base64)\.ts$)' \
            "$PATH_FILTER_LIST" >/dev/null; then
            echo "deploy_api_worker=true" >> "$GITHUB_OUTPUT"
            echo "API worker deploy: path filter matched."
          else
            echo "deploy_api_worker=false" >> "$GITHUB_OUTPUT"
            echo "API worker deploy: skipped (no relevant path changes)."
          fi

          if grep -E \
            '^(\.github/workflows/deploy\.yml|packages/api-docs-worker/)' \
            "$PATH_FILTER_LIST" >/dev/null; then
            echo "deploy_api_docs_worker=true" >> "$GITHUB_OUTPUT"
            echo "API docs worker deploy: path filter matched."
          else
            echo "deploy_api_docs_worker=false" >> "$GITHUB_OUTPUT"
            echo "API docs worker deploy: skipped (no relevant path changes)."
          fi

          # Do not treat deploy.yml itself as an nx-cache change. Runtime
          # token / secret wiring edits would otherwise upload this worker
          # and a 10000 auth miss blocks the rest of the production deploy.
          if grep -E \
            '^(\.github/workflows/nx-cache-deploy\.yml|tools/ci/nx-cache-resources|packages/nx-cache/)' \
            "$PATH_FILTER_LIST" >/dev/null; then
            echo "deploy_nx_cache_worker=true" >> "$GITHUB_OUTPUT"
            echo "Nx cache worker deploy: path filter matched."
          else
            echo "deploy_nx_cache_worker=false" >> "$GITHUB_OUTPUT"
            echo "Nx cache worker deploy: skipped (no relevant path changes)."
          fi
          rm -f "$PATH_FILTER_LIST"

  # Cloudflare token split (#2010). CLOUDFLARE_API_TOKEN is the deploy token:
  # wrangler and tools/ci authenticate with it, and it is never uploaded to a
  # Worker. Each Worker's CLOUDFLARE_API_TOKEN secret comes from its own
  # narrower GitHub secret, overwritten on every sync so no Worker keeps a
  # stale deploy-scope value:
  #   kody-production, kody-platform <- CLOUDFLARE_APP_API_TOKEN
  #   kody-runtime                   <- CLOUDFLARE_RUNTIME_API_TOKEN
  #   kody-status                    <- CLOUDFLARE_STATUS_API_TOKEN
  # There is no fallback to the deploy token. Run this before any production
  # mutation (including jobs/highlight siblings) so a missing token fails the
  # deploy instead of leaving the fleet half-applied.
  require-worker-tokens:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🔒 Require Worker-scoped Cloudflare tokens
    timeout-minutes: 2
    needs: sha-guard
    if: needs.sha-guard.outputs.should_deploy == 'true'
    environment:
      name: production
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.sha-guard.outputs.deploy_sha }}
          fetch-depth: 1

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: 🔒 Check Worker-scoped Cloudflare tokens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_APP_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_API_TOKEN }}
          CLOUDFLARE_RUNTIME_API_TOKEN:
            ${{ secrets.CLOUDFLARE_RUNTIME_API_TOKEN }}
          CLOUDFLARE_STATUS_API_TOKEN:
            ${{ secrets.CLOUDFLARE_STATUS_API_TOKEN }}
        run: >
          node tools/ci/check-worker-cloudflare-tokens.ts
          CLOUDFLARE_APP_API_TOKEN CLOUDFLARE_RUNTIME_API_TOKEN
          CLOUDFLARE_STATUS_API_TOKEN

  # The jobs worker deploys before origin so origin's JOBS service binding
  # can validate against an existing jobs-worker script. See
  # docs/contributing/architecture/jobs-worker-migration-runbook.md.
  deploy-highlight-worker:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🎨 Deploy highlight worker
    timeout-minutes: 8
    needs:
      - sha-guard
      - require-worker-tokens
    if: >-
      needs.sha-guard.outputs.should_deploy == 'true' &&
      needs.sha-guard.outputs.deploy_highlight == 'true' &&
      needs.require-worker-tokens.result == 'success'
    environment:
      name: production
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.sha-guard.outputs.deploy_sha }}
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: ☁️ Deploy highlight worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Highlight worker deploy attempt $attempt/$deploy_attempts"
            set +e
            node ./wrangler-env.ts deploy \
              --config packages/highlight-worker/wrangler.jsonc \
              --name kody-highlight \
              --env production \
              --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee highlight-deploy.log
            deploy_status="${PIPESTATUS[0]}"
            set -e
            if [ "$deploy_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Highlight worker deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi
            echo "Retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

      - name: 🩺 Healthcheck (highlight worker)
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          HIGHLIGHT_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync("highlight-deploy.log", "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const matches = text.match(/https:\/\/[a-zA-Z0-9._-]+\.workers\.dev/g); process.stdout.write(matches?.at(-1) ?? "")')"
          if [ -z "$HIGHLIGHT_URL" ]; then
            echo "No workers.dev URL in highlight worker deploy output; skipping healthcheck."
            exit 0
          fi

          HEALTHCHECK_URL="${HIGHLIGHT_URL%/}/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=20
          delay_seconds=3
          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > highlight-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('highlight-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true) { console.error('highlight-healthcheck-unexpected-response', json); process.exit(1); } if (json?.commit !== expected) { console.error('highlight-healthcheck-unexpected-commit', { expected, actual: json?.commit }); process.exit(1); } console.log('highlight-healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Highlight worker healthcheck failed after ${attempts} attempts." >&2
          if [ -f highlight-health.json ]; then
            echo "Last response body:" >&2
            cat highlight-health.json >&2
          fi
          exit 1

  # The push queue worker deploys before origin so origin's REPO_PUSH_QUEUE
  # service binding validates against an existing kody-push-queue script. It
  # owns the RepoPushQueueV1 Durable Object (migration tag v1), so this uses
  # `wrangler deploy`; see packages/push-queue-worker/readme.md.
  deploy-push-queue-worker:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 📮 Deploy push queue worker
    timeout-minutes: 8
    needs:
      - sha-guard
      - require-worker-tokens
    if: >-
      needs.sha-guard.outputs.should_deploy == 'true' &&
      needs.sha-guard.outputs.deploy_push_queue == 'true' &&
      needs.require-worker-tokens.result == 'success'
    environment:
      name: production
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.sha-guard.outputs.deploy_sha }}
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: ☁️ Deploy push queue worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Push queue worker deploy attempt $attempt/$deploy_attempts"
            set +e
            node ./wrangler-env.ts deploy \
              --config packages/push-queue-worker/wrangler.jsonc \
              --name kody-push-queue \
              --env production \
              --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee push-queue-deploy.log
            deploy_status="${PIPESTATUS[0]}"
            set -e
            if [ "$deploy_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Push queue worker deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi
            echo "Retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

      - name: 🩺 Healthcheck (push queue worker)
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          PUSH_QUEUE_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync("push-queue-deploy.log", "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const matches = text.match(/https:\/\/[a-zA-Z0-9._-]+\.workers\.dev/g); process.stdout.write(matches?.at(-1) ?? "")')"
          if [ -z "$PUSH_QUEUE_URL" ]; then
            echo "No workers.dev URL in push queue worker deploy output; skipping healthcheck."
            exit 0
          fi

          HEALTHCHECK_URL="${PUSH_QUEUE_URL%/}/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=20
          delay_seconds=3
          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > push-queue-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('push-queue-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true) { console.error('push-queue-healthcheck-unexpected-response', json); process.exit(1); } if (json?.commit !== expected) { console.error('push-queue-healthcheck-unexpected-commit', { expected, actual: json?.commit }); process.exit(1); } console.log('push-queue-healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Push queue worker healthcheck failed after ${attempts} attempts." >&2
          if [ -f push-queue-health.json ]; then
            echo "Last response body:" >&2
            cat push-queue-health.json >&2
          fi
          exit 1

  deploy-jobs-worker:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: ⏰ Deploy jobs worker
    timeout-minutes: 8
    needs:
      - sha-guard
      - require-worker-tokens
    if: >-
      needs.sha-guard.outputs.should_deploy == 'true' &&
      needs.sha-guard.outputs.deploy_jobs == 'true' &&
      needs.require-worker-tokens.result == 'success'
    environment:
      name: production
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.sha-guard.outputs.deploy_sha }}
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🧱 Ensure jobs worker resources (D1 + Queues)
        id: jobs_resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node tools/ci/jobs-worker-resources.ts ensure --env production --out-config packages/jobs-worker/wrangler-production.generated.json | tee -a "$GITHUB_OUTPUT"

      - name: 🗄️ Apply D1 Migrations (jobs)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG:
            ${{ steps.jobs_resources.outputs.jobs_wrangler_config }}
        run: |
          node ./wrangler-env.ts d1 migrations apply JOBS_DB --remote --config "$WRANGLER_CONFIG"

      - name: 🔐 Sync jobs worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG:
            ${{ steps.jobs_resources.outputs.jobs_wrangler_config }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -euo pipefail
          # The jobs worker only has optional secrets; sync-worker-secrets
          # fails on an empty set, so skip when SENTRY_DSN is not configured.
          if [ -z "${SENTRY_DSN:-}" ]; then
            echo "SENTRY_DSN is not configured; skipping jobs worker secret sync."
            exit 0
          fi
          # --env "" with --name: wrangler secret bulk still suffixes
          # -<env> even when --name is set, so --env production would write
          # to kody-jobs-production while deploy uploads kody-jobs.
          node tools/ci/sync-worker-secrets.ts --env "" --config \
            "$WRANGLER_CONFIG" --name kody-jobs --set-from-env-optional SENTRY_DSN

      - name: ☁️ Deploy jobs worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
          WRANGLER_CONFIG:
            ${{ steps.jobs_resources.outputs.jobs_wrangler_config }}
        run: |
          set -euo pipefail

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Jobs worker deploy attempt $attempt/$deploy_attempts"
            set +e
            # Explicit --name: without it wrangler would append the
            # environment to the script name (kody-jobs-production), which
            # would not match the main worker's JOBS service binding.
            node ./wrangler-env.ts deploy --config "$WRANGLER_CONFIG" \
              --name kody-jobs \
              --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee jobs-deploy.log
            deploy_status="${PIPESTATUS[0]}"
            set -e
            if [ "$deploy_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Jobs worker deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi
            echo "Retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

      - name: 🩺 Healthcheck (jobs worker)
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          JOBS_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync("jobs-deploy.log", "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const matches = text.match(/https:\/\/[a-zA-Z0-9._-]+\.workers\.dev/g); process.stdout.write(matches?.at(-1) ?? "")')"
          if [ -z "$JOBS_URL" ]; then
            echo "No workers.dev URL in jobs worker deploy output; skipping healthcheck."
            exit 0
          fi

          HEALTHCHECK_URL="${JOBS_URL%/}/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=20
          delay_seconds=3
          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > jobs-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('jobs-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true) { console.error('jobs-healthcheck-unexpected-response', json); process.exit(1); } if (json?.commit !== expected) { console.error('jobs-healthcheck-unexpected-commit', { expected, actual: json?.commit }); process.exit(1); } console.log('jobs-healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Jobs worker healthcheck failed after ${attempts} attempts." >&2
          if [ -f jobs-health.json ]; then
            echo "Last response body:" >&2
            cat jobs-health.json >&2
          fi
          exit 1

  deploy:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🚀 Deploy to production
    timeout-minutes: 20
    needs:
      - sha-guard
      - require-worker-tokens
      - deploy-jobs-worker
      - deploy-highlight-worker
      - deploy-push-queue-worker
    if: >-
      always() && !cancelled() && needs.sha-guard.result == 'success' &&
      needs.require-worker-tokens.result == 'success' &&
      needs.sha-guard.outputs.should_deploy == 'true' &&
      (needs.deploy-jobs-worker.result == 'success' ||
        needs.deploy-jobs-worker.result == 'skipped') &&
      (needs.deploy-highlight-worker.result == 'success' ||
        needs.deploy-highlight-worker.result == 'skipped') &&
      (needs.deploy-push-queue-worker.result == 'success' ||
        needs.deploy-push-queue-worker.result == 'skipped') &&
      (needs.sha-guard.outputs.deploy_main == 'true' ||
        needs.sha-guard.outputs.deploy_platform == 'true' ||
        needs.sha-guard.outputs.deploy_runtime == 'true')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.sha-guard.outputs.deploy_sha }}
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 📝 Prepare worker env
        run: cp packages/worker/.env.example packages/worker/.env

      - name: 🧱 Ensure production resources
        id: resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          # Legacy app hostnames kept attached (and optionally redirected)
          # during a domain migration; see tools/ci/resource-utils.ts.
          APP_LEGACY_HOSTS: ${{ vars.APP_LEGACY_HOSTS }}
          APP_LEGACY_REDIRECT: ${{ vars.APP_LEGACY_REDIRECT }}
          PACKAGE_APP_LEGACY_HOSTS: ${{ vars.PACKAGE_APP_LEGACY_HOSTS }}
          PACKAGE_APP_LEGACY_REDIRECT: ${{ vars.PACKAGE_APP_LEGACY_REDIRECT }}
          USER_EMAIL_DOMAIN: ${{ vars.USER_EMAIL_DOMAIN }}
          SYSTEM_EMAIL_DOMAIN: ${{ vars.SYSTEM_EMAIL_DOMAIN }}
          LEGACY_USER_EMAIL_DOMAINS: ${{ vars.LEGACY_USER_EMAIL_DOMAINS }}
          LEGACY_SYSTEM_EMAIL_DOMAINS: ${{ vars.LEGACY_SYSTEM_EMAIL_DOMAINS }}
          # Optional override for DMARC rua forward destination (default
          # me@kentcdodds.com in tools/ci/resource-utils.ts).
          DMARC_REPORT_FORWARD_TO: ${{ vars.DMARC_REPORT_FORWARD_TO }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          # Prefer environment secret when Kent (or CI) stored the zone id as a
          # secret; fall back to a production environment variable. Empty vars
          # alone left PACKAGE_APP_ZONE_ID blank in deploy logs (#3717 follow-up).
          PACKAGE_APP_ZONE_ID:
            ${{ secrets.PACKAGE_APP_ZONE_ID || vars.PACKAGE_APP_ZONE_ID }}
        run: |
          set -euo pipefail
          node tools/ci/production-resources.ts ensure --out-config packages/worker/wrangler-production.generated.json | tee -a "$GITHUB_OUTPUT"

      # Package runtime worker (ADR 0016). Shares the main worker's data
      # plane, so it derives resource ids from the generated main config and
      # patches the main config's cross-script references in place.
      - name: 🧩 Generate runtime worker config
        id: runtime_config
        if: >-
          needs.sha-guard.outputs.deploy_runtime == 'true' ||
          needs.sha-guard.outputs.deploy_platform == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        run: |
          set -euo pipefail
          node tools/ci/runtime-worker-config.ts generate \
            --env production \
            --main-config packages/worker/wrangler-production.generated.json \
            --worker-name kody-runtime \
            --platform-worker-name kody-platform \
            --main-worker-name kody-production \
            --out-config packages/runtime-worker/wrangler-production.generated.json | tee -a "$GITHUB_OUTPUT"

      # Platform Durable Object worker (ADR 0034). Shares the origin worker's
      # data plane. Deploy this script before runtime and origin so their
      # cross-script bindings target a live kody-platform script.
      - name: 🧩 Generate platform worker config
        id: platform_config
        if: >-
          needs.sha-guard.outputs.deploy_platform == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        run: |
          set -euo pipefail
          node tools/ci/platform-worker-config.ts generate \
            --env production \
            --main-config packages/worker/wrangler-production.generated.json \
            --worker-name kody-platform \
            --runtime-worker-name kody-runtime \
            --main-worker-name kody-production \
            --out-config packages/platform-worker/wrangler-production.generated.json | tee -a "$GITHUB_OUTPUT"

      - name: 🔐 Sync Cloudflare Secrets (bulk)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_APP_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_API_TOKEN }}
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          SECRET_STORE_KEY: ${{ secrets.SECRET_STORE_KEY }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CAPABILITY_REINDEX_SECRET: ${{ secrets.CAPABILITY_REINDEX_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.OAUTH_X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.OAUTH_X_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.OAUTH_DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.OAUTH_DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_MEMBER_ROLE_ID: ${{ secrets.DISCORD_MEMBER_ROLE_ID }}
          DISCORD_STANDARD_ROLE_ID: ${{ secrets.DISCORD_STANDARD_ROLE_ID }}
          DISCORD_PRO_ROLE_ID: ${{ secrets.DISCORD_PRO_ROLE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STATUS_INCIDENT_EVENT_SECRET:
            ${{ secrets.STATUS_INCIDENT_EVENT_SECRET }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          OIDC_SIGNING_PRIVATE_KEY_PEM:
            ${{ secrets.OIDC_SIGNING_PRIVATE_KEY_PEM }}
          OIDC_SIGNING_KEY_ID: ${{ secrets.OIDC_SIGNING_KEY_ID }}
          CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN:
            ${{ secrets.CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN }}
          PACKAGE_APP_TICKET_KEYS: ${{ secrets.PACKAGE_APP_TICKET_KEYS }}
        run: >
          node tools/ci/sync-worker-secrets.ts --env production --config
          "$WRANGLER_CONFIG" --set-from-env COOKIE_SECRET
          --set-from-env-optional SECRET_STORE_KEY --set-from-env-optional
          AI_GATEWAY_ID --set-from-env-optional SENTRY_DSN --set-from-env
          CLOUDFLARE_API_TOKEN=CLOUDFLARE_APP_API_TOKEN --set-from-env-optional
          CAPABILITY_REINDEX_SECRET --set-from-env-optional GITHUB_CLIENT_ID
          --set-from-env-optional GITHUB_CLIENT_SECRET --set-from-env-optional
          GOOGLE_CLIENT_ID --set-from-env-optional GOOGLE_CLIENT_SECRET
          --set-from-env-optional X_CLIENT_ID --set-from-env-optional
          X_CLIENT_SECRET --set-from-env-optional DISCORD_CLIENT_ID
          --set-from-env-optional DISCORD_CLIENT_SECRET --set-from-env-optional
          DISCORD_BOT_TOKEN --set-from-env-optional DISCORD_GUILD_ID
          --set-from-env-optional DISCORD_MEMBER_ROLE_ID --set-from-env-optional
          DISCORD_STANDARD_ROLE_ID --set-from-env-optional DISCORD_PRO_ROLE_ID
          --set-from-env-optional KIT_API_KEY --set-from-env-optional
          STRIPE_SECRET_KEY --set-from-env-optional STRIPE_WEBHOOK_SECRET
          --set-from-env-optional STATUS_INCIDENT_EVENT_SECRET
          --set-from-env-optional YOUTUBE_DATA_API_KEY --set-from-env
          OIDC_SIGNING_PRIVATE_KEY_PEM --set-from-env OIDC_SIGNING_KEY_ID
          --set-from-env-optional CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN
          --set-from-env-optional PACKAGE_APP_TICKET_KEYS

      # Runtime-lane secret allowlist (ADR 0016): only the secrets the
      # package runtime lane actually reads. COOKIE_SECRET/SECRET_STORE_KEY
      # (app-origin sessions + user secret store), AI_GATEWAY_ID (capability
      # embeddings), SENTRY_DSN (error reporting), CLOUDFLARE_API_TOKEN
      # (Cloudflare REST capabilities), PACKAGE_APP_TICKET_KEYS (package-app
      # access tickets on the package-app origin). Billing (Stripe), Kit subscriber tags,
      # OAuth client credentials, and maintenance secrets stay main-only so a
      # runtime-Worker compromise cannot reach them.
      # The runtime Worker's CLOUDFLARE_API_TOKEN comes from the narrower
      # CLOUDFLARE_RUNTIME_API_TOKEN GitHub secret (Email Sending + Artifacts
      # only; see docs/contributing/environment-variables.md). It is required
      # and never falls back to the deploy token.
      # --env "" with --name: wrangler secret bulk still suffixes -<env>
      # even when --name is set, so --env production would write
      # COOKIE_SECRET to kody-runtime-production while deploy uploads
      # kody-runtime. Preview uses the same empty-env pin.
      - name: 🔐 Sync Cloudflare Secrets to runtime worker (bulk)
        if: >-
          needs.sha-guard.outputs.deploy_runtime == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RUNTIME_API_TOKEN:
            ${{ secrets.CLOUDFLARE_RUNTIME_API_TOKEN }}
          WRANGLER_CONFIG:
            ${{ steps.runtime_config.outputs.runtime_wrangler_config }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          SECRET_STORE_KEY: ${{ secrets.SECRET_STORE_KEY }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PACKAGE_APP_TICKET_KEYS: ${{ secrets.PACKAGE_APP_TICKET_KEYS }}
        run: >
          node tools/ci/sync-worker-secrets.ts --env "" --name kody-runtime
          --config "$WRANGLER_CONFIG" --set-from-env COOKIE_SECRET
          --set-from-env-optional SECRET_STORE_KEY --set-from-env-optional
          AI_GATEWAY_ID --set-from-env-optional SENTRY_DSN --set-from-env
          CLOUDFLARE_API_TOKEN=CLOUDFLARE_RUNTIME_API_TOKEN
          --set-from-env-optional PACKAGE_APP_TICKET_KEYS

      # Platform worker is trusted (same secret set as origin): MCP Durable
      # Objects execute capabilities that need OAuth, Stripe, and the rest.
      # --env "" with --name: same wrangler suffix pitfall as runtime.
      - name: 🔐 Sync Cloudflare Secrets to platform worker (bulk)
        if: >-
          needs.sha-guard.outputs.deploy_platform == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        env:
          # A fresh account has no Worker version for versions secret bulk to patch.
          PLATFORM_SECRET_MODE:
            ${{ steps.resources.outputs.origin_deploy_mode != 'fresh' &&
            '--versioned' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_APP_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_API_TOKEN }}
          WRANGLER_CONFIG:
            ${{ steps.platform_config.outputs.platform_wrangler_config }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          SECRET_STORE_KEY: ${{ secrets.SECRET_STORE_KEY }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          CAPABILITY_REINDEX_SECRET: ${{ secrets.CAPABILITY_REINDEX_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          X_CLIENT_ID: ${{ secrets.OAUTH_X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.OAUTH_X_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.OAUTH_DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.OAUTH_DISCORD_CLIENT_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_MEMBER_ROLE_ID: ${{ secrets.DISCORD_MEMBER_ROLE_ID }}
          DISCORD_STANDARD_ROLE_ID: ${{ secrets.DISCORD_STANDARD_ROLE_ID }}
          DISCORD_PRO_ROLE_ID: ${{ secrets.DISCORD_PRO_ROLE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STATUS_INCIDENT_EVENT_SECRET:
            ${{ secrets.STATUS_INCIDENT_EVENT_SECRET }}
          OIDC_SIGNING_PRIVATE_KEY_PEM:
            ${{ secrets.OIDC_SIGNING_PRIVATE_KEY_PEM }}
          OIDC_SIGNING_KEY_ID: ${{ secrets.OIDC_SIGNING_KEY_ID }}
          CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN:
            ${{ secrets.CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN }}
        run: >
          node tools/ci/sync-worker-secrets.ts
          ${PLATFORM_SECRET_MODE:+$PLATFORM_SECRET_MODE} --env "" --name
          kody-platform --config "$WRANGLER_CONFIG" --set-from-env COOKIE_SECRET
          --set-from-env-optional SECRET_STORE_KEY --set-from-env-optional
          AI_GATEWAY_ID --set-from-env-optional SENTRY_DSN --set-from-env
          CLOUDFLARE_API_TOKEN=CLOUDFLARE_APP_API_TOKEN --set-from-env-optional
          CAPABILITY_REINDEX_SECRET --set-from-env-optional GITHUB_CLIENT_ID
          --set-from-env-optional GITHUB_CLIENT_SECRET --set-from-env-optional
          GOOGLE_CLIENT_ID --set-from-env-optional GOOGLE_CLIENT_SECRET
          --set-from-env-optional X_CLIENT_ID --set-from-env-optional
          X_CLIENT_SECRET --set-from-env-optional DISCORD_CLIENT_ID
          --set-from-env-optional DISCORD_CLIENT_SECRET --set-from-env-optional
          DISCORD_BOT_TOKEN --set-from-env-optional DISCORD_GUILD_ID
          --set-from-env-optional DISCORD_MEMBER_ROLE_ID --set-from-env-optional
          DISCORD_STANDARD_ROLE_ID --set-from-env-optional DISCORD_PRO_ROLE_ID
          --set-from-env-optional KIT_API_KEY --set-from-env-optional
          STRIPE_SECRET_KEY --set-from-env-optional STRIPE_WEBHOOK_SECRET
          --set-from-env-optional STATUS_INCIDENT_EVENT_SECRET --set-from-env
          OIDC_SIGNING_PRIVATE_KEY_PEM --set-from-env OIDC_SIGNING_KEY_ID
          --set-from-env-optional CLOUDFLARE_CUSTOM_HOSTNAMES_API_TOKEN

      - name: 🗄️ Apply D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
        run: |
          node ./wrangler-env.ts d1 migrations apply APP_DB --remote --config "$WRANGLER_CONFIG"
          node ./wrangler-env.ts d1 migrations apply AUDIT_DB --remote --config "$WRANGLER_CONFIG"

      # Fresh production origin only: replay new_sqlite_classes with the full
      # entry so platform/runtime transferred_classes have a source script.
      # Steady-state production never takes this path.
      - name: ☁️ Bootstrap fresh origin Worker (full entry)
        if: steps.resources.outputs.origin_deploy_mode == 'fresh'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: production
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
          WRANGLER_CONFIG:
            ${{ steps.resources.outputs.origin_bootstrap_wrangler_config }}
        run: |
          set -euo pipefail
          if [ -z "${WRANGLER_CONFIG:-}" ]; then
            echo "Fresh origin bootstrap is missing origin_bootstrap_wrangler_config." >&2
            exit 1
          fi

          is_retryable_deploy_failure() {
            node tools/ci/is-retryable-deploy-failure.ts deploy-origin-bootstrap.log
          }

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Origin bootstrap deploy attempt $attempt/$deploy_attempts"
            set +e
            npm run deploy -- --name kody-production --config "$WRANGLER_CONFIG" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee deploy-origin-bootstrap.log
            deploy_status="${PIPESTATUS[0]}"
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Origin bootstrap deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi

            if ! is_retryable_deploy_failure; then
              echo "Origin bootstrap deploy failed with a non-retryable error." >&2
              exit "$deploy_status"
            fi

            echo "Retryable Cloudflare deploy failure detected; retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

      # Deploys before runtime and origin so cross-script Durable Object
      # bindings stay valid. See
      # docs/contributing/architecture/platform-worker-migration-runbook.md.
      - name: ☁️ Deploy platform worker to Cloudflare Workers
        id: deploy_platform
        if: >-
          needs.sha-guard.outputs.deploy_platform == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
          WRANGLER_CONFIG:
            ${{ steps.platform_config.outputs.platform_wrangler_config }}
        run: |
          set -euo pipefail

          is_retryable_deploy_failure() {
            node tools/ci/is-retryable-deploy-failure.ts deploy-platform.log
          }

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Platform deploy attempt $attempt/$deploy_attempts"
            set +e
            # Explicit --name: without it wrangler appends the environment to
            # the script name (kody-platform-production), which would not
            # match origin/runtime cross-script bindings.
            npm run deploy -- --name kody-platform --config "$WRANGLER_CONFIG" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee deploy-platform.log
            deploy_status="${PIPESTATUS[0]}"
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Platform deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi

            if ! is_retryable_deploy_failure; then
              echo "Platform deploy failed with a non-retryable error." >&2
              exit "$deploy_status"
            fi

            echo "Retryable Cloudflare deploy failure detected; retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

          PLATFORM_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const worker = process.argv[2]; const escaped = worker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); const workerUrlRegex = new RegExp(`https://(?:[a-zA-Z0-9-]+\\.)?${escaped}\\.[a-zA-Z0-9._-]+\\.workers\\.dev`, "g"); const matches = text.match(workerUrlRegex); process.stdout.write(matches?.at(-1) ?? "")' deploy-platform.log kody-platform)"
          if [ -n "$PLATFORM_URL" ]; then
            echo "url=$PLATFORM_URL" >> "$GITHUB_OUTPUT"
          fi

      # Deploys before origin so origin's cross-script Durable Object and
      # service bindings target a live kody-runtime script. See
      # docs/contributing/architecture/runtime-worker-migration-runbook.md.
      - name: ☁️ Deploy runtime worker to Cloudflare Workers
        id: deploy_runtime
        if: >-
          needs.sha-guard.outputs.deploy_runtime == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
          WRANGLER_CONFIG:
            ${{ steps.runtime_config.outputs.runtime_wrangler_config }}
        run: |
          set -euo pipefail

          is_retryable_deploy_failure() {
            node tools/ci/is-retryable-deploy-failure.ts deploy-runtime.log
          }

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Runtime deploy attempt $attempt/$deploy_attempts"
            set +e
            # Explicit --name: without it wrangler appends the environment to
            # the script name (kody-runtime-production), which would not match
            # the main worker's cross-script bindings.
            npm run deploy -- --name kody-runtime --config "$WRANGLER_CONFIG" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee deploy-runtime.log
            deploy_status="${PIPESTATUS[0]}"
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Runtime deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi

            if ! is_retryable_deploy_failure; then
              echo "Runtime deploy failed with a non-retryable error." >&2
              exit "$deploy_status"
            fi

            echo "Retryable Cloudflare deploy failure detected; retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

          RUNTIME_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const worker = process.argv[2]; const escaped = worker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); const workerUrlRegex = new RegExp(`https://(?:[a-zA-Z0-9-]+\\.)?${escaped}\\.[a-zA-Z0-9._-]+\\.workers\\.dev`, "g"); const matches = text.match(workerUrlRegex); process.stdout.write(matches?.at(-1) ?? "")' deploy-runtime.log kody-runtime)"
          if [ -n "$RUNTIME_URL" ]; then
            echo "url=$RUNTIME_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧾 Collect deploy info
        id: deploy_info
        if: >-
          needs.sha-guard.outputs.deploy_main == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        env:
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
          DEPLOY_ENVIRONMENT: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_DEPLOY_INFO="$(node tools/ci/build-deploy-info.ts)"
          echo "app_deploy_info=$APP_DEPLOY_INFO" >> "$GITHUB_OUTPUT"

      - name: Find retained production client assets
        id: retained_assets
        if: >-
          needs.sha-guard.outputs.deploy_main == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        uses: actions/github-script@v8
        with:
          script: |
            for (let page = 1; ; page++) {
              const artifacts = await github.rest.actions.listArtifactsForRepo({
                ...context.repo, name: 'production-client-assets', per_page: 100, page,
              })
              for (const archive of artifacts.data.artifacts) {
                const source = archive.workflow_run
                if (archive.expired || !source || source.id === context.runId ||
                    source.head_branch !== 'main' ||
                    source.head_repository_id !== source.repository_id) continue
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  ...context.repo, run_id: source.id,
                })
                if (run.status !== 'completed' ||
                    run.path.split('@')[0] !== '.github/workflows/deploy.yml') continue
                core.setOutput('artifact_id', String(archive.id))
                core.setOutput('run_id', String(source.id))
                return
              }
              if (artifacts.data.artifacts.length < 100) break
            }
            core.info('No retained archive yet; this deployment starts asset retention.')

      - name: Restore retained production client assets
        if: steps.retained_assets.outputs.artifact_id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.retained_assets.outputs.artifact_id }}
          run-id: ${{ steps.retained_assets.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .tmp/previous-client-assets
          merge-multiple: true

      - name: ☁️ Deploy to Cloudflare Workers
        id: deploy
        if: >-
          needs.sha-guard.outputs.deploy_main == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: production
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
          APP_DEPLOY_INFO: ${{ steps.deploy_info.outputs.app_deploy_info }}
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
          KODY_RETAIN_CLIENT_ASSETS: '1'
        run: |
          set -euo pipefail
          # Explicit --name: Vite emits a flattened wrangler.json whose
          # `name` is still top-level `kody`. Without this (and without
          # wrangler-env.ts adding --env production) Wrangler uploads a
          # new `kody` script and replays origin Durable Object migrations
          # the slim entry does not export.
          DEPLOY_ARGS=(--name kody-production --config "$WRANGLER_CONFIG" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" --var "APP_DEPLOY_INFO:${APP_DEPLOY_INFO}")

          is_retryable_deploy_failure() {
            node tools/ci/is-retryable-deploy-failure.ts deploy.log
          }

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Deploy attempt $attempt/$deploy_attempts"
            set +e
            npm run deploy -- "${DEPLOY_ARGS[@]}" 2>&1 | tee deploy.log
            deploy_status="${PIPESTATUS[0]}"
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi

            if ! is_retryable_deploy_failure; then
              echo "Deploy failed with a non-retryable error." >&2
              exit "$deploy_status"
            fi

            echo "Retryable Cloudflare deploy failure detected; retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

          DEPLOY_URL="${APP_BASE_URL:-}"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="$(node -e "const fs = require('node:fs'); const t = fs.readFileSync('deploy.log','utf8'); const m = t.match(/https:\\/\\/[a-zA-Z0-9._-]+\\.workers\\.dev/g); process.stdout.write(m?.at(-1) ?? '')")"
          fi

          if [ -n "$DEPLOY_URL" ]; then
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Save deployed production client assets
        if: steps.deploy.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: production-client-assets
          path: .tmp/deployed-client-assets/
          if-no-files-found: error
          retention-days: 8

      - name: 📤 Upload Worker source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          APP_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Skipping Sentry source map upload (set SENTRY_AUTH_TOKEN secret and SENTRY_ORG / SENTRY_PROJECT repo variables)."
            exit 0
          fi
          npm run sentry:upload-sourcemaps

      - name: 🩺 Healthcheck (production)
        if: >-
          needs.sha-guard.outputs.deploy_main == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "Missing deploy URL output; cannot run healthcheck." >&2
            exit 1
          fi

          if [ -z "${EXPECTED_COMMIT_SHA:-}" ]; then
            echo "Missing expected commit SHA; cannot verify deployment version." >&2
            exit 1
          fi

          HEALTHCHECK_URL="${DEPLOY_URL%/}/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=20
          delay_seconds=3

          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > health.json && \
              node -e "const fs = require('node:fs'); const body = fs.readFileSync('health.json','utf8'); const json = JSON.parse(body); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true) { console.error('healthcheck-unexpected-response', json); process.exit(1); } if (json?.commitSha !== expected) { console.error('healthcheck-unexpected-commit-sha', { expected, actual: json?.commitSha }); process.exit(1); } console.log('healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Healthcheck failed after ${attempts} attempts: $HEALTHCHECK_URL" >&2
          if [ -f health.json ]; then
            echo "Last response body:" >&2
            cat health.json >&2
          fi
          exit 1

      - name: 🩺 Healthcheck platform worker (production)
        if: >-
          needs.sha-guard.outputs.deploy_platform == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        shell: bash
        env:
          PLATFORM_URL: ${{ steps.deploy_platform.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          if [ -z "${PLATFORM_URL:-}" ]; then
            echo "Missing platform worker deploy URL output; cannot run healthcheck." >&2
            exit 1
          fi

          if [ -z "${EXPECTED_COMMIT_SHA:-}" ]; then
            echo "Missing expected commit SHA; cannot verify platform deployment version." >&2
            exit 1
          fi

          HEALTHCHECK_URL="${PLATFORM_URL%/}/__platform/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=20
          delay_seconds=3

          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > platform-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('platform-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.status !== 'ok') { console.error('platform-healthcheck-unexpected-response', json); process.exit(1); } if (json?.commitSha !== expected) { console.error('platform-healthcheck-unexpected-commit-sha', { expected, actual: json?.commitSha }); process.exit(1); } if (json?.cookieSecretConfigured !== true) { console.error('platform-healthcheck-missing-cookie-secret', json); process.exit(1); } console.log('platform-healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Platform worker healthcheck failed after ${attempts} attempts: $HEALTHCHECK_URL" >&2
          if [ -f platform-health.json ]; then
            echo "Last response body:" >&2
            cat platform-health.json >&2
          fi
          exit 1

      - name: 🩺 Healthcheck runtime worker (production)
        if: >-
          needs.sha-guard.outputs.deploy_runtime == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.deploy_runtime.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          if [ -z "${RUNTIME_URL:-}" ]; then
            echo "Missing runtime worker deploy URL output; cannot run healthcheck." >&2
            exit 1
          fi

          if [ -z "${EXPECTED_COMMIT_SHA:-}" ]; then
            echo "Missing expected commit SHA; cannot verify runtime deployment version." >&2
            exit 1
          fi

          HEALTHCHECK_URL="${RUNTIME_URL%/}/__runtime/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=20
          delay_seconds=3

          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > runtime-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('runtime-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.status !== 'ok') { console.error('runtime-healthcheck-unexpected-response', json); process.exit(1); } if (json?.commitSha !== expected) { console.error('runtime-healthcheck-unexpected-commit-sha', { expected, actual: json?.commitSha }); process.exit(1); } if (json?.cookieSecretConfigured !== true) { console.error('runtime-healthcheck-missing-cookie-secret', json); process.exit(1); } console.log('runtime-healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Runtime worker healthcheck failed after ${attempts} attempts: $HEALTHCHECK_URL" >&2
          if [ -f runtime-health.json ]; then
            echo "Last response body:" >&2
            cat runtime-health.json >&2
          fi
          exit 1

      - name: 🧪 Origin-only execute smoke check (production)
        if: >-
          needs.sha-guard.outputs.deploy_main == 'true' ||
          steps.resources.outputs.origin_deploy_mode == 'fresh'
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          CAPABILITY_REINDEX_SECRET: ${{ secrets.CAPABILITY_REINDEX_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CAPABILITY_REINDEX_SECRET:-}" ]; then
            echo "Skipping execute smoke check (CAPABILITY_REINDEX_SECRET not set)."
            exit 0
          fi
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "Missing deploy URL output; cannot run execute smoke check." >&2
            exit 1
          fi

          base="${DEPLOY_URL%/}"
          smoke_url="${base}/__maintenance/execute-smoke"
          echo "POST ${smoke_url}"

          attempts=10
          delay_seconds=3
          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            status="$(curl --silent --show-error --location --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${CAPABILITY_REINDEX_SECRET}" \
              -H "Accept: application/json" \
              --output execute-smoke.json \
              --write-out "%{http_code}" \
              "${smoke_url}")"
            cat execute-smoke.json
            echo
            if [ "$status" -ge 200 ] && [ "$status" -lt 300 ] && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('execute-smoke.json','utf8')); if (json?.ok !== true || json?.result !== 42) { console.error('execute-smoke-unexpected-response', json); process.exit(1); } console.log('execute-smoke-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Execute smoke check failed after ${attempts} attempts: ${smoke_url}" >&2
          exit 1

      - name: 🧭 Reindex capability vectors (Vectorize)
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          CAPABILITY_REINDEX_SECRET: ${{ secrets.CAPABILITY_REINDEX_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CAPABILITY_REINDEX_SECRET:-}" ]; then
            echo "Skipping capability reindex (CAPABILITY_REINDEX_SECRET not set)."
            exit 0
          fi
          if [ -z "${DEPLOY_URL:-}" ]; then
            echo "Skipping capability reindex (no deploy URL)."
            exit 0
          fi
          # Builtins only. User-owned memory/job/package vectors upsert on write.
          # A full sweep (omit --phases) is a DR / embedding-model rebuild, not a
          # ship gate.
          node tools/ci/reindex-capabilities.ts --url "$DEPLOY_URL" --phases capabilities

  deploy-status-worker:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 📟 Deploy status worker
    timeout-minutes: 8
    # Deploys after the main worker so the status prober never probes a
    # production worker that predates the endpoints it expects (for example
    # /health/components), which would open spurious incidents.
    needs:
      - sha-guard
      - require-worker-tokens
      - deploy
    # always() is required: `deploy` itself uses always() so it can run
    # after skipped jobs/highlight siblings. Without always() here, GitHub
    # skips this job whenever those siblings were skipped — even when the
    # path filter set deploy_status_worker=true (see #2143: guard matched
    # packages/status/ but this job never started).
    # require-worker-tokens already gated STATUS (and APP/RUNTIME) before any
    # sibling mutation; re-check here only if that job somehow did not run.
    if: >-
      always() && !cancelled() && needs.sha-guard.result == 'success' &&
      needs.require-worker-tokens.result == 'success' && needs.deploy.result ==
      'success' && needs.sha-guard.outputs.should_deploy == 'true' &&
      needs.sha-guard.outputs.deploy_status_worker == 'true'
    environment:
      name: production
      url: https://status.kody.codes
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.sha-guard.outputs.deploy_sha }}
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: ☁️ Deploy status worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Status worker deploy attempt $attempt/$deploy_attempts"
            set +e
            npm run status:deploy -- \
              --var "BUILD_COMMIT:${DEPLOY_COMMIT_SHA}" 2>&1 | tee status-deploy.log
            deploy_status="${PIPESTATUS[0]}"
            set -e
            if [ "$deploy_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Status worker deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi
            echo "Retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

      - name: 🔐 Sync status worker alert email secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STATUS_API_TOKEN:
            ${{ secrets.CLOUDFLARE_STATUS_API_TOKEN }}
        run: |
          set -euo pipefail
          # The status worker sends alert email through the Cloudflare Email
          # REST API. Wrangler authenticates with the deploy token; the Worker
          # secret is the Email Sending-only CLOUDFLARE_STATUS_API_TOKEN.
          if [ -z "${CLOUDFLARE_STATUS_API_TOKEN:-}" ]; then
            echo "Missing GitHub Actions secret CLOUDFLARE_STATUS_API_TOKEN." >&2
            exit 1
          fi
          printf '%s' "$CLOUDFLARE_STATUS_API_TOKEN" | npx wrangler secret put \
            CLOUDFLARE_API_TOKEN --config packages/status/wrangler.jsonc

      - name: 🔐 Sync status incident event secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STATUS_INCIDENT_EVENT_SECRET:
            ${{ secrets.STATUS_INCIDENT_EVENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${STATUS_INCIDENT_EVENT_SECRET:-}" ]; then
            echo "STATUS_INCIDENT_EVENT_SECRET unset; deleting the status-worker secret if present so emit cannot keep using a retired token."
            npx wrangler secret delete STATUS_INCIDENT_EVENT_SECRET \
              --config packages/status/wrangler.jsonc || true
            exit 0
          fi
          printf '%s' "$STATUS_INCIDENT_EVENT_SECRET" | npx wrangler secret put \
            STATUS_INCIDENT_EVENT_SECRET --config packages/status/wrangler.jsonc

      - name: 🩺 Healthcheck (status worker)
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          HEALTHCHECK_URL="https://status.kody.codes/health"

          attempts=20
          delay_seconds=3
          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            echo "Healthcheck URL: $HEALTHCHECK_URL"
            if curl --fail --silent --show-error --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > status-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('status-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true) { console.error('status-healthcheck-unexpected-response', json); process.exit(1); } if (json?.commit !== expected) { console.error('status-healthcheck-unexpected-commit', { expected, actual: json?.commit }); process.exit(1); } console.log('status-healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Status worker healthcheck failed after ${attempts} attempts." >&2
          if [ -f status-health.json ]; then
            echo "Last response body:" >&2
            cat status-health.json >&2
          fi
          exit 1

  deploy-api-worker:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🔌 Deploy API worker (api.kody.codes)
    timeout-minutes: 8
    # The KODY_API service binding targets the origin's KodyApi entrypoint,
    # so this deploys after origin. `deploy` may be skipped when only the
    # edge worker changed; the binding then targets the live origin.
    # require-worker-tokens must succeed: when that job fails, `deploy` is
    # skipped (not failed), and skipped must not greenlight an API rollout.
    needs:
      - sha-guard
      - require-worker-tokens
      - deploy
    if: >-
      always() && !cancelled() && needs.sha-guard.result == 'success' &&
      needs.require-worker-tokens.result == 'success' &&
      needs.sha-guard.outputs.should_deploy == 'true' &&
      needs.sha-guard.outputs.deploy_api_worker == 'true' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    environment:
      name: production
      url: https://api.kody.codes
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.sha-guard.outputs.deploy_sha }}
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: ☁️ Deploy API worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "API worker deploy attempt $attempt/$deploy_attempts"
            set +e
            # Explicit --name: without it wrangler appends the environment
            # to the script name (kody-api-production).
            node ./wrangler-env.ts deploy \
              --config packages/api-worker/wrangler.jsonc \
              --name kody-api \
              --env production \
              --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee api-deploy.log
            deploy_status="${PIPESTATUS[0]}"
            set -e
            if [ "$deploy_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "API worker deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi
            echo "Retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

      - name: 🩺 Healthcheck (API worker)
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          API_URL="https://api.kody.codes"

          # A brand-new custom domain can take a few minutes for DNS and the
          # edge certificate, so this waits longer than the other workers.
          attempts=40
          delay_seconds=6
          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --max-time 10 \
              --header "Accept: application/json" \
              "$API_URL/health" > api-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('api-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true || json?.commit !== expected) { console.error('api-healthcheck-unexpected-response', { expected, json }); process.exit(1); } console.log('api-healthcheck-ok', json);" && \
              curl --fail --silent --show-error --max-time 20 \
                --header "Accept: application/json" \
                "$API_URL/openapi.json" > api-openapi.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('api-openapi.json','utf8')); if (!json?.openapi?.startsWith('3.') || !json?.paths?.['/v1/capability-proxy/session']) { console.error('api-openapi-unexpected-response', Object.keys(json ?? {})); process.exit(1); } console.log('api-openapi-ok', json.openapi, Object.keys(json.paths).length, 'paths');"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "API worker healthcheck failed after ${attempts} attempts." >&2
          if [ -f api-health.json ]; then
            echo "Last health body:" >&2
            cat api-health.json >&2
          fi
          exit 1

  deploy-api-docs-worker:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 📚 Deploy API docs worker (api-docs.kody.codes)
    timeout-minutes: 8
    # Independent of origin: docs fetch the live OpenAPI JSON over HTTPS.
    # Deploys after the API worker when that job ran, so a brand-new API
