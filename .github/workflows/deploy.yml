          BACKUP_SOURCE_ACCOUNT_ID: a99ee2e72728dd52902ef288b7b1447d
          BACKUP_DESTINATION_ACCOUNT_ID: ${{ secrets.DR_BACKUP_ACCOUNT_ID }}
          BACKUP_R2_BUCKET_NAME: kody-production-backups
          BACKUP_WORKER_NAME: kody-production-d1-backups
          BACKUP_SOURCE_D1_ALLOWLIST: >-
            [{"uuid":"8c1014d1-6b41-4695-a0a2-159071f0f919","name":"kody"}]
        run: node tools/ci/backup-resources-reconcile-cli.ts

      - name: ☁️ Deploy backup control plane to DR account
        env:
