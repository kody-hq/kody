            deploy_status="${PIPESTATUS[0]}"
            set -e
            if [ "$deploy_status" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "API docs worker deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi
            echo "Retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

      - name: 🩺 Healthcheck (API docs worker)
        shell: bash
        env:
          EXPECTED_COMMIT_SHA: ${{ needs.sha-guard.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          DOCS_URL="https://api-docs.kody.codes"

          # Custom domain DNS + cert can take a few minutes on first deploy.
          attempts=40
          delay_seconds=6
          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --max-time 10 \
              --header "Accept: application/json" \
              "$DOCS_URL/health" > api-docs-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('api-docs-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true || json?.commit !== expected) { console.error('api-docs-healthcheck-unexpected-response', { expected, json }); process.exit(1); } console.log('api-docs-healthcheck-ok', json);" && \
              curl --fail --silent --show-error --max-time 20 \
              "$DOCS_URL/" > api-docs-index.html && \
              node -e "const fs = require('node:fs'); const html = fs.readFileSync('api-docs-index.html','utf8'); if (!html.includes('api-reference') || !html.includes('/openapi.json')) { console.error('api-docs-html-unexpected'); process.exit(1); } console.log('api-docs-html-ok', html.length);" && \
              curl --fail --silent --show-error --max-time 20 \
                --header "Accept: application/json" \
                "$DOCS_URL/openapi.json" > api-docs-openapi.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('api-docs-openapi.json','utf8')); if (!json?.openapi?.startsWith('3.') || !json?.info?.title) { console.error('api-docs-openapi-unexpected-response', Object.keys(json ?? {})); process.exit(1); } console.log('api-docs-openapi-ok', json.openapi, json.info.title);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "API docs worker healthcheck failed after ${attempts} attempts." >&2
          if [ -f api-docs-health.json ]; then
            echo "Last health body:" >&2
            cat api-docs-health.json >&2
          fi
          exit 1

  deploy-backup-control-plane:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🛟 Deploy DR backup control plane
