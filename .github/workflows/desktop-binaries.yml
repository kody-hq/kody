name: Desktop binaries

on:
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-binaries.yml'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-binaries.yml'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: win
            arch: x64
            runner: windows-latest
          - platform: win
            arch: arm64
            runner: windows-11-arm
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      KODY_SKIP_SKILL_REFRESH: '1'
      KODY_SKIP_GIT_HELPER_REFRESH: '1'
      KODY_DESKTOP_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libxss1 libasound2t64 libgbm1 libsecret-1-0 libfuse2t64 xvfb
      # Electron and electron-builder fetch Electron zips and AppImage/Windows SDK
      # tools from GitHub releases; a cache hit skips the 504-prone download.
      - name: Cache Electron downloads
        uses: actions/cache@v5.0.3
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key:
            electron-${{ runner.os }}-${{ matrix.arch }}-${{
            hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ matrix.arch }}-
      - run: npm ci
      - name: Build bundled CLI
        run: npm run build --workspace @kodycodes/cli
      - name: Validate desktop
        run: npm run desktop:validate
      # MSIX installs only when signed by a trusted certificate, so CI signs
      # with a disposable one to install and launch the real package.
      - name: Create a disposable MSIX signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate -Type Custom -Subject 'CN=Kody Desktop CI' -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $password = [guid]::NewGuid().ToString()
          "::add-mask::$password"
          Export-PfxCertificate -Cert $certificate -FilePath "$env:RUNNER_TEMP\ci-signing.pfx" -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          "WIN_CSC_LINK=$env:RUNNER_TEMP\ci-signing.pfx" >> $env:GITHUB_ENV
          "WIN_CSC_KEY_PASSWORD=$password" >> $env:GITHUB_ENV
      - name: Build installers
        run:
          npm run dist --workspace @kodycodes/desktop -- --${{ matrix.platform
          }} --${{ matrix.arch }}
      - name: Verify packaged CLI and native bindings
        run: npm run test:packaged-cli --workspace @kodycodes/desktop
      - name: Electron smoke (menus, register, Start/Stop/Start runner)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y xvfb
            xvfb-run -a npm run test:smoke --workspace @kodycodes/desktop
          else
            npm run test:smoke --workspace @kodycodes/desktop
          fi
      - name: Verify signatures and install the MSIX
        if: runner.os == 'Windows'
        env:
          EXPECTED_PUBLISHER: Kody Desktop CI
        shell: pwsh
        run: ./packages/desktop/scripts/win-install-msix.ps1
      - name: Smoke the installed MSIX (app starts, main window loads)
        if: runner.os == 'Windows'
        run:
          npm run test:smoke --workspace @kodycodes/desktop --
          "$KODY_MSIX_EXECUTABLE"
      - name: Write the App Installer file
        if: runner.os == 'Windows'
        run: node packages/desktop/scripts/win-appinstaller.cjs
      - name:
          Smoke the AppImage and installed .deb (app starts, main window loads)
        if: runner.os == 'Linux'
        run: ./packages/desktop/scripts/linux-smoke.sh
      - name: Upload binaries and checksums
        uses: actions/upload-artifact@v4
        with:
          name: kody-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          path: |
            artifacts/desktop/*.dmg
            artifacts/desktop/*.zip
            artifacts/desktop/*.msix
            artifacts/desktop/*.appinstaller
            artifacts/desktop/*.cer
            artifacts/desktop/*.AppImage
            artifacts/desktop/*.deb
            artifacts/desktop/*.blockmap
            artifacts/desktop/latest*.yml
            artifacts/desktop/SHA256SUMS-*.txt
            artifacts/desktop/build-info-*.json
