name: Publish MCP Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
      - tools/ci/mcp-registry-publish.ts

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: Publish server.json to MCP Registry
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Decide whether to publish
        id: decide
        run: node tools/ci/mcp-registry-publish.ts decide

      - name: Install mcp-publisher
        if: steps.decide.outputs.action == 'publish'
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate with GitHub OIDC
        if: steps.decide.outputs.action == 'publish'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.decide.outputs.action == 'publish'
        run: |
          set -euo pipefail
          if output=$(./mcp-publisher publish 2>&1); then
            printf '%s\n' "$output"
          else
            printf '%s\n' "$output"
            node tools/ci/mcp-registry-publish.ts interpret-error --text "$output"
          fi
