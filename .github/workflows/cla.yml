name: ✍️ CLA

on:
  # pull_request_target (not pull_request): fork PRs get a read-only
  # GITHUB_TOKEN on pull_request, so the unsigned-instructions comment 403s.
  # This job checks out the base ref only and never runs PR head code.
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cla:
    # opened/reopened/synchronize only; closed drives record-on-merge below.
    if: >
      github.event_name == 'pull_request_target' && github.event.action !=
      'closed'
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: ✍️ CLA
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📦 Checkout base
        uses: actions/checkout@v6.0.2
        with:
          # Trusted base branch tip only (never the PR head).
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: 📜 Checkout CLA signatures
        uses: actions/checkout@v6.0.2
        with:
          # Signer records live on this branch, never on the PR head.
          ref: cla-signatures
          path: cla-signatures
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: 🧾 Collect identities
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const pullNumber = Number(process.env.PR_NUMBER)
            const identities = [
              {
                githubLogin: context.payload.pull_request.user.login,
                name: context.payload.pull_request.user.login,
                email: null,
              },
            ]
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                per_page: 100,
              },
            )
            for (const commit of commits) {
              identities.push({
                githubLogin: commit.author?.login ?? null,
                name: commit.commit.author?.name ?? null,
                email: commit.commit.author?.email ?? null,
              })
            }
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                per_page: 100,
              },
            )
            const signingComments = comments
              .filter((comment) => comment.user?.type === 'User')
              .map((comment) => ({
                login: comment.user.login,
                createdAt: comment.created_at,
                body: comment.body ?? '',
              }))
            const fs = await import('node:fs/promises')
            await fs.writeFile(
              'cla-identities.json',
              `${JSON.stringify(identities, null, '\t')}\n`,
            )
            await fs.writeFile(
              'cla-signing-comments.json',
              `${JSON.stringify(signingComments, null, '\t')}\n`,
            )

      - name: ✍️ Check CLA
        id: check
        run: |
          check_args=(
            --signers cla-signatures/cla-signers.json
            --identities-json cla-identities.json
          )
          if grep -q -- '--signing-comments-json' tools/ci/check-cla.ts; then
            check_args+=(--signing-comments-json cla-signing-comments.json)
          fi
          set +e
          node tools/ci/check-cla.ts "${check_args[@]}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            exit "$code"
          fi

      - name: 💬 Comment when unsigned
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const marker = '<!-- kody-cla-check -->'
            const body = `${marker}
            Unsigned contributions cannot merge.

            1. Read the [Individual CLA](https://github.com/${{ github.repository }}/blob/main/docs/legal/individual-cla.md) (or the [Entity CLA](https://github.com/${{ github.repository }}/blob/main/docs/legal/entity-cla.md) if an organization owns the work).
            2. Comment exactly: \`I have read the CLA and I hereby sign the CLA\`
            3. That signing comment satisfies this check. The signer is recorded on the \`cla-signatures\` branch after this pull request merges. See [Inbound contributions](https://github.com/${{ github.repository }}/blob/main/docs/contributing/inbound-contributions.md).

            Adding your own username on this branch does not pass the check.`
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100,
              },
            )
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              })
            }

      - name: ❌ Fail when unsigned
        if: steps.check.outputs.exit_code == '1'
        run: exit 1

  record:
    if: >
      github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      (contains(github.event.comment.body, 'I hereby sign the CLA') ||
      (github.event.action == 'edited' &&
      contains(github.event.changes.body.from, 'I hereby sign the CLA')))
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 📝 Record CLA
    timeout-minutes: 5
    permissions:
      pull-requests: write
      actions: write
    steps:
      - name: 💬 Comment and re-run CLA
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          CLA_LOGIN: ${{ github.event.comment.user.login }}
        with:
          script: |
            const login = process.env.CLA_LOGIN
            const commentBody = context.payload.comment.body ?? ''
            const isSigning = commentBody.trim() === 'I have read the CLA and I hereby sign the CLA'
            const pullNumber = Number(process.env.PR_NUMBER)
            const owner = context.repo.owner
            const repo = context.repo.repo
            const pull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            })
            const headSha = pull.data.head.sha

            // Mirror tools/ci/cla-workflow-events.ts pickClaRerunCandidate /
            // claRerunEventOrder: check runs on pull_request_target; ignore
            // skipped dual-trigger / closed-only runs so we re-run the real check.
            async function latestClaRun() {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'cla.yml',
                event: 'pull_request_target',
                head_sha: headSha,
                per_page: 5,
              })
              return (
                runs.data.workflow_runs.find(
                  (run) =>
                    run.status !== 'completed' || run.conclusion !== 'skipped',
                ) ?? null
              )
            }

            const deadline = Date.now() + 180_000
            let latest = await latestClaRun()
            while (latest && latest.status !== 'completed' && Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 10_000))
              latest = await latestClaRun()
            }

            let reran = false
            if (latest?.status === 'completed') {
              try {
                await github.rest.actions.reRunWorkflow({
                  owner,
                  repo,
                  run_id: latest.id,
                })
                reran = true
              } catch (error) {
                core.warning(
                  `Could not re-run CLA: ${error instanceof Error ? error.message : String(error)}`,
                )
              }
            }

            if (isSigning) {
              const marker = '<!-- kody-cla-recorded -->'
              const followUp = reran
                ? 'The CLA check will re-run.'
                : 'The CLA check will include this signing comment on its next run.'
              const body = `${marker}
            Thanks @${login} — your signature on this PR satisfies the CLA check, and you'll be recorded on the \`cla-signatures\` branch after this PR merges. ${followUp}`
              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: pullNumber,
                  per_page: 100,
                },
              )
              const existing = comments.find((comment) =>
                comment.body?.includes(marker),
              )
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pullNumber,
                  body,
                })
              }
            }

  record-on-merge:
    if: >
      (github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true) || github.event_name ==
      'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 📝 Record CLA after merge
    timeout-minutes: 15
    concurrency:
      group: cla-signatures
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 📦 Checkout main
        uses: actions/checkout@v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: 📜 Checkout CLA signatures
        uses: actions/checkout@v6.0.2
        with:
          # Signers are committed straight to this branch; the main ruleset
          # does not cover it, so no bot PR or Validate run is needed.
          ref: cla-signatures
          path: cla-signatures

      - name: 🧾 Collect signing comments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const path = require('node:path')
            const fs = require('node:fs/promises')
            const {
              githubApiErrorStatus,
              isRetryableGithubApiError,
              withGithubApiRetry,
            } = require(
              path.join(
                process.env.GITHUB_WORKSPACE,
                'tools/ci/github-api-retry.cjs',
              ),
            )
            const owner = context.repo.owner
            const repo = context.repo.repo

            async function collectSigningComments() {
              // Prefer recently merged PRs over recently updated ones: comment
              // activity on older merged PRs must not crowd out a new signer.
              // GitHub cannot list by merged_at, so scan by updated_at (always
              // >= merged_at) until the page reaches PRs updated before the 50th
              // newest merge: nothing older can merge later than that cutoff.
              const byMergedDesc = (left, right) =>
                Date.parse(right.merged_at) - Date.parse(left.merged_at)
              const mergedByNumber = new Map()
              for (let page = 1; page <= 200; page += 1) {
                const response = await github.rest.pulls.list({
                  owner,
                  repo,
                  state: 'closed',
                  base: 'main',
                  sort: 'updated',
                  direction: 'desc',
                  per_page: 100,
                  page,
                })
                if (response.data.length === 0) break
                for (const pull of response.data) {
                  if (pull.merged_at) mergedByNumber.set(pull.number, pull)
                }
                if (response.data.length < 100) break
                if (mergedByNumber.size >= 50) {
                  const cutoff = Date.parse(
                    [...mergedByNumber.values()].sort(byMergedDesc)[49]
                      .merged_at,
                  )
                  const oldestUpdated = Date.parse(
                    response.data.at(-1).updated_at,
                  )
                  if (oldestUpdated < cutoff) break
                }
              }
              const mergedPulls = [...mergedByNumber.values()]
                .sort(byMergedDesc)
                .slice(0, 50)

              const candidates = new Map(
                mergedPulls.map((pull) => [pull.number, pull]),
              )
              const eventPull = context.payload.pull_request
              if (eventPull) candidates.set(eventPull.number, eventPull)

              const signingComments = []
              for (const pull of candidates.values()) {
                const eligibleLogins = new Set()
                const authorLogin = pull.user?.login
                if (authorLogin) eligibleLogins.add(authorLogin.toLowerCase())

                const commits = await github.paginate(
                  github.rest.pulls.listCommits,
                  {
                    owner,
                    repo,
                    pull_number: pull.number,
                    per_page: 100,
                  },
                )
                for (const commit of commits) {
                  const login = commit.author?.login
                  if (login) eligibleLogins.add(login.toLowerCase())
                }

                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner,
                    repo,
                    issue_number: pull.number,
                    per_page: 100,
                  },
                )
                for (const comment of comments) {
                  const login = comment.user?.login
                  if (
                    comment.user?.type !== 'User' ||
                    !login ||
                    !eligibleLogins.has(login.toLowerCase())
                  ) {
                    continue
                  }
                  signingComments.push({
                    login,
                    createdAt: comment.created_at,
                    body: comment.body ?? '',
                  })
                }
              }
              signingComments.sort((left, right) =>
                left.createdAt.localeCompare(right.createdAt),
              )
              return signingComments
            }

            try {
              // Five attempts; delays 8s + 16s + 32s + 64s (~2 minutes).
              const signingComments = await withGithubApiRetry(
                collectSigningComments,
                {
                  maxAttempts: 5,
                  baseDelayMs: 8_000,
                  onRetry: ({ attempt, maxAttempts, delayMs, error }) => {
                    const status = githubApiErrorStatus(error) ?? 'network'
                    const detail =
                      error instanceof Error ? error.message : String(error)
                    core.info(
                      `Transient GitHub error (${status}) on CLA collect attempt ${attempt}/${maxAttempts}: ${detail}. Retrying in ${delayMs}ms.`,
                    )
                  },
                },
              )
              await fs.writeFile(
                'cla-signing-comments.json',
                `${JSON.stringify(signingComments, null, '\t')}\n`,
              )
            } catch (error) {
              if (isRetryableGithubApiError(error)) {
                const status = githubApiErrorStatus(error) ?? 'network'
                const detail =
                  error instanceof Error ? error.message : String(error)
                core.warning(
                  `CLA collect failed after retries due to transient GitHub error (${status}): ${detail}. Skipping this run; the next merge rescans the last 50 merges and records any missed signers.`,
                )
                await fs.writeFile('cla-signing-comments.json', '[]\n')
                return
              }
              throw error
            }

      - name: 📝 Apply signer comments
        id: record
        run: |
          node tools/ci/check-cla.ts \
            --signers cla-signatures/cla-signers.json \
            --record-comments-json cla-signing-comments.json > cla-record-output.txt
          cat cla-record-output.txt
          grep -E '^(added|github)=' cla-record-output.txt >> "$GITHUB_OUTPUT"

      - name: 🌱 Commit and push signers
        if: steps.record.outputs.added == 'true'
        working-directory: cla-signatures
        env:
          CLA_LOGINS: ${{ steps.record.outputs.github }}
        run: |
          set -euo pipefail
          git add cla-signers.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record CLA signers: @${CLA_LOGINS//,/, @}"
          git push origin HEAD:refs/heads/cla-signatures
