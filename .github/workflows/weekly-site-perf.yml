name: ⏱ Weekly site perf

on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  measure:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: ⏱ Measure kody.codes
    timeout-minutes: 10
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: 📏 Collect
        run: >
          node tools/site-perf/collect.ts --url https://kody.codes/ --json
          --exit-zero > site-perf-report.json

      - name: 📎 Upload report
        uses: actions/upload-artifact@v4
        with:
          name: site-perf-report
          path: site-perf-report.json

      - name: 🎫 Upsert tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/site-perf/upsert-github-issue.ts site-perf-report.json

      - name: 🚀 Invoke weekly-site-perf package
        env:
          KODY_WEBHOOK_URL_RUN: ${{ secrets.KODY_WEBHOOK_URL_RUN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          node tools/site-perf/invoke-site-perf-package.ts site-perf-report.json
