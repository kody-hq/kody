name: 🔎 Preview
# preview-sweep.ts reads "Preview deploy (branch: <name>)" back to find the
# branch a branch preview was deployed from (#3707). Keep the format in sync.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Preview {0} ({1}:
  {2})', inputs.action, inputs.target, inputs.target == 'pr' && inputs.pr_number
  || inputs.preview_name || github.ref_name) || github.event.pull_request.title
  }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
      - closed
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or cleanup preview resources
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - cleanup
      target:
        description: Preview naming strategy
        required: true
        type: choice
        default: branch
        options:
          - branch
          - pr
      pr_number:
        description: PR number (required when target=pr)
        required: false
        type: string
      preview_name:
        description: Optional preview name override (target=branch)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: >-
    preview-${{ github.event.pull_request.number || format('{0}-{1}',
    inputs.target, inputs.target == 'pr' && inputs.pr_number ||
    inputs.preview_name || github.ref_name) }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🔎 Deploy Preview Resources
    # Includes room for deploy retries, healthchecks, and failed-deploy
    # cleanup (150s budget). Raised from 15 so a healthy origin/platform/runtime
    # is not cancelled mid API healthcheck (#3495).
    timeout-minutes: 25
    # Do not set `environment:` here. A per-PR GitHub Environment auto-creates
    # `preview-<n>` (or `preview-<run_id>`) entries that pile up in Settings;
    # the preview URL is posted as a PR comment instead. Cleanup still deletes
    # any leftover `preview-*` Environment on PR close.
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.draft == false &&
        ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          startsWith(github.event.label.name, 'preview-flag:'))) ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.action == 'deploy')
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          # Full history so rename-aware d1_migrations rewrite can recover the
          # pre-renumber SQL blob for sha256 matching (#2776 / Devin).
          fetch-depth: 0

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🧾 Collect deploy info
        id: deploy_info
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          DEPLOY_ENVIRONMENT: preview
          DEPLOY_PR_NUMBER:
            ${{ github.event.pull_request.number || inputs.pr_number }}
          DEPLOY_PR_URL: ${{ github.event.pull_request.html_url }}
          DEPLOY_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APP_DEPLOY_INFO="$(node tools/ci/build-deploy-info.ts)"
          echo "app_deploy_info=$APP_DEPLOY_INFO" >> "$GITHUB_OUTPUT"

      - name: 🧾 Resolve preview names
        id: names
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PREVIEW_NAME: ${{ inputs.preview_name }}
        run: |
          set -euo pipefail
          APP_NAME="kody"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PREVIEW_KIND="pr"
            PREVIEW_ID="$PR_NUMBER"
          else
            PREVIEW_KIND="$INPUT_TARGET"
            PREVIEW_ID=""
            if [ "$PREVIEW_KIND" = "pr" ]; then
              PREVIEW_ID="$INPUT_PR_NUMBER"
              if [ -z "$PREVIEW_ID" ]; then
                echo "inputs.pr_number is required when inputs.target=pr" >&2
                exit 1
              fi
            else
              PREVIEW_ID="$INPUT_PREVIEW_NAME"
              if [ -z "$PREVIEW_ID" ]; then
                PREVIEW_ID="$REF_NAME"
              fi
            fi
          fi

          # Cloudflare Worker names must be URL-safe; normalize to lower-kebab-case.
          slug="$(echo "$PREVIEW_ID" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' | cut -c1-32)"
          if [ -z "$slug" ]; then
            slug="preview"
          fi

          if [ "$PREVIEW_KIND" = "pr" ]; then
            APP_WORKER_NAME="${APP_NAME}-pr-${slug}"
          else
            APP_WORKER_NAME="${APP_NAME}-branch-${slug}"
          fi

          echo "preview_kind=$PREVIEW_KIND" >> "$GITHUB_OUTPUT"
          echo "preview_id=$PREVIEW_ID" >> "$GITHUB_OUTPUT"
          echo "worker_name=$APP_WORKER_NAME" >> "$GITHUB_OUTPUT"

      # Also classifies the live preview origin script (same planner as
      # production, tools/ci/origin-production-deploy-state.ts) and emits
      # origin_deploy_mode / origin_entry. A fresh or slim-topology preview
      # uploads the slim production-worker.ts entry with cross-script Durable
      # Object bindings; only a legacy preview whose origin still owns
      # transferred classes falls back to the full index.ts entry.
      - name: 🧱 Ensure preview resources (D1 + KV)
        id: resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
        run: |
          set -euo pipefail
          node tools/ci/preview-resources.ts ensure --worker-name "$APP_WORKER_NAME" --out-config packages/worker/wrangler-preview.generated.json | tee -a "$GITHUB_OUTPUT"

      # Package runtime worker (ADR 0016) and platform Durable Object worker
      # (ADR 0034). Share the preview data plane, so configs derive resource
      # ids from the main generated config. The origin owns no Durable Object
      # class (same topology as steady-state production), so it deploys last;
      # platform and runtime bind each other, so a fresh set deploys platform
      # (bootstrap, no runtime references) → runtime → platform (full) →
      # origin.
      - name: 🧩 Generate runtime worker preview config
        id: runtime_config
        env:
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
        run: |
          set -euo pipefail
          node tools/ci/runtime-worker-config.ts generate \
            --env preview \
            --main-config "$WRANGLER_CONFIG" \
            --worker-name "${APP_WORKER_NAME}-runtime" \
            --platform-worker-name "${APP_WORKER_NAME}-platform" \
            --main-worker-name "$APP_WORKER_NAME" \
            --out-config packages/runtime-worker/wrangler-preview.generated.json | tee -a "$GITHUB_OUTPUT"
          echo "runtime_worker_name=${APP_WORKER_NAME}-runtime" >> "$GITHUB_OUTPUT"

      - name: 🧩 Generate platform worker preview config
        id: platform_config
        env:
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
        run: |
          set -euo pipefail
          node tools/ci/platform-worker-config.ts generate \
            --env preview \
            --main-config "$WRANGLER_CONFIG" \
            --worker-name "${APP_WORKER_NAME}-platform" \
            --runtime-worker-name "${APP_WORKER_NAME}-runtime" \
            --main-worker-name "$APP_WORKER_NAME" \
            --out-config packages/platform-worker/wrangler-preview.generated.json \
            --out-platform-bootstrap-config packages/platform-worker/wrangler-preview-bootstrap.generated.json | tee -a "$GITHUB_OUTPUT"
          echo "platform_worker_name=${APP_WORKER_NAME}-platform" >> "$GITHUB_OUTPUT"

      - name: 🗄️ Apply D1 Migrations (preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
        run: |
          # Rename-aware bookkeeping: if this PR renumbered a migration that
          # preview D1 already applied under the old name, rewrite the ledger
          # row when the SQL sha256 still matches (#2776). Never runs in prod.
          node tools/ci/rewrite-renamed-preview-migrations.ts \
            --remote \
            --binding APP_DB \
            --config "$WRANGLER_CONFIG" \
            --migrations-dir packages/worker/migrations
          node tools/ci/rewrite-renamed-preview-migrations.ts \
            --remote \
            --binding AUDIT_DB \
            --config "$WRANGLER_CONFIG" \
            --migrations-dir packages/worker/audit-migrations
          node ./wrangler-env.ts d1 migrations apply APP_DB --remote --config "$WRANGLER_CONFIG"
          node ./wrangler-env.ts d1 migrations apply AUDIT_DB --remote --config "$WRANGLER_CONFIG"

      - name: 🧪 Deploy preview mock Workers
        id: deploy_mocks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
        run: |
          set -euo pipefail
          MOCK_API_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$MOCK_API_TOKEN"
          OVERRIDES_FILE="preview-secrets-overrides.env"
          : > "$OVERRIDES_FILE"

          mock_summary=""
          mock_comment_summary=""

          for dir in packages/mock-servers/*; do
            if [ ! -d "$dir" ]; then
              continue
            fi
            if [ ! -f "$dir/wrangler.jsonc" ]; then
              continue
            fi

            service="$(basename "$dir")"
            service_key="$(echo "$service" | tr '[:lower:]-' '[:upper:]_')"
            mock_worker_name="${APP_WORKER_NAME}-mock-${service}"
            deploy_log="deploy-mock-${service}.log"

            node tools/ci/sync-worker-secrets.ts --env "" --name "$mock_worker_name" --config "$dir/wrangler.jsonc" --set "MOCK_API_TOKEN=$MOCK_API_TOKEN"

            node ./wrangler-env.ts deploy --env preview --name "$mock_worker_name" --config "$dir/wrangler.jsonc" 2>&1 | tee "$deploy_log"

            mock_url="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const worker = process.argv[2]; const escaped = worker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); const workerUrlRegex = new RegExp(`https://(?:[a-zA-Z0-9-]+\\.)?${escaped}\\.[a-zA-Z0-9._-]+\\.workers\\.dev`, "g"); const matches = text.match(workerUrlRegex); process.stdout.write(matches?.at(-1) ?? "")' "$deploy_log" "$mock_worker_name")"
            if [ -z "$mock_url" ]; then
              echo "Failed to parse mock URL for $service." >&2
              exit 1
            fi
            mock_version_preview_url="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const match = text.match(/(?:Version\s+)?Preview URL:\s*(https:\/\/\S+)/i); process.stdout.write(match?.[1] ?? "")' "$deploy_log")"

            echo "${service_key}_API_BASE_URL=$mock_url" >> "$OVERRIDES_FILE"
            case "$service_key" in
              AI)
                secret_env_key="AI_MOCK_API_KEY"
                ;;
              CLOUDFLARE)
                secret_env_key="CLOUDFLARE_API_TOKEN"
                # Do not set CLOUDFLARE_API_SOURCE_SNAPSHOTS: preview package
                # source restorability uses per-PR BUNDLE_ARTIFACTS_KV (same as
                # production), not the mock whole-tree endpoint. Artifacts
                # create/token/fork hit the real Artifacts API via the native
                # ARTIFACTS binding + CLOUDFLARE_ARTIFACTS_API_TOKEN.
                ;;
              *)
                secret_env_key="${service_key}_API_KEY"
                ;;
            esac
            echo "${secret_env_key}=$MOCK_API_TOKEN" >> "$OVERRIDES_FILE"

            mock_summary_line="- ${service}: ${mock_url} (\`${mock_worker_name}\`)"
            mock_comment_summary_line="- ${service}: [${mock_url}/__mocks](${mock_url}/__mocks?token=${MOCK_API_TOKEN}) (\`${mock_worker_name}\`)"
            if [ -n "$mock_version_preview_url" ]; then
              mock_summary_line="${mock_summary_line} | version preview: ${mock_version_preview_url}"
              mock_comment_summary_line="${mock_comment_summary_line} | version preview: [${mock_version_preview_url}](${mock_version_preview_url})"
            fi

            mock_summary="${mock_summary}\n${mock_summary_line}"
            mock_comment_summary="${mock_comment_summary}\n${mock_comment_summary_line}"
          done

          if [ -n "$mock_summary" ]; then
            mock_summary="$(printf "%b" "$mock_summary" | sed '1{/^$/d;}')"
          fi
          if [ -n "$mock_comment_summary" ]; then
            mock_comment_summary="$(printf "%b" "$mock_comment_summary" | sed '1{/^$/d;}')"
          fi

          {
            echo "mock_summary<<EOF"
            printf "%b\n" "$mock_summary"
            echo "EOF"
            echo "mock_comment_summary<<EOF"
            printf "%b\n" "$mock_comment_summary"
            echo "EOF"
            echo "overrides_file=$OVERRIDES_FILE"
          } >> "$GITHUB_OUTPUT"

      # Per-preview app/jobs workers reference each other via service
      # bindings, and the Cloudflare API rejects bindings to scripts that do
      # not exist yet. Bootstrap order: deploy the jobs worker WITHOUT its
      # HOST binding first, then the app worker (whose JOBS binding now
      # resolves), then redeploy the jobs worker with the full config so its
      # HOST binding points at the freshly deployed app worker. Preview jobs
      # workers are new scripts, so the generated config creates the
      # JobManager class fresh instead of running the production script
      # transfer.
      - name: 🧱 Ensure preview jobs worker resources (own JOBS_DB)
        id: jobs_resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
          JOBS_D1_NAME: ${{ steps.resources.outputs.jobs_d1_database_name }}
        run: |
          set -euo pipefail
          node tools/ci/jobs-worker-resources.ts ensure --env preview --worker-name "${APP_WORKER_NAME}-jobs" --host-worker-name "$APP_WORKER_NAME" --jobs-d1-name "$JOBS_D1_NAME" --out-config packages/jobs-worker/wrangler-preview.generated.json | tee -a "$GITHUB_OUTPUT"

      - name: 🗄️ Apply D1 Migrations (preview jobs)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          WRANGLER_CONFIG:
            ${{ steps.jobs_resources.outputs.jobs_wrangler_config }}
        run: |
          node tools/ci/rewrite-renamed-preview-migrations.ts \
            --remote \
            --binding JOBS_DB \
            --config "$WRANGLER_CONFIG" \
            --migrations-dir packages/jobs-worker/migrations
          node ./wrangler-env.ts d1 migrations apply JOBS_DB --remote --config "$WRANGLER_CONFIG"

      - name: ☁️ Deploy preview highlight worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
        run: |
          set -euo pipefail
          node ./wrangler-env.ts deploy \
            --config packages/highlight-worker/wrangler.jsonc \
            --name "${APP_WORKER_NAME}-highlight" \
            --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}"

      - name: ☁️ Deploy preview push queue worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
        run: |
          set -euo pipefail
          node ./wrangler-env.ts deploy \
            --config packages/push-queue-worker/wrangler.jsonc \
            --name "${APP_WORKER_NAME}-push-queue" \
            --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}"

      - name: ☁️ Bootstrap preview jobs worker (no HOST binding)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
          WRANGLER_CONFIG:
            ${{ steps.jobs_resources.outputs.jobs_wrangler_bootstrap_config }}
        run: |
          set -euo pipefail
          # Explicit --name: without it wrangler appends the environment to
          # the script name (…-jobs-preview), which would not match the app
          # worker's JOBS service binding.
          node ./wrangler-env.ts deploy --config "$WRANGLER_CONFIG" --name "${APP_WORKER_NAME}-jobs" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}"

      # Platform and runtime bind each other's Durable Objects, and the
      # Cloudflare API rejects a binding to a script that does not exist yet.
      # Until the runtime script exists, upload the platform Worker without
      # its runtime references; the full platform deploy below restores them
      # once runtime is live. A steady preview (both scripts already own
      # their classes) skips straight to the full deploys.
      - name: ☁️ Bootstrap preview platform Worker (no runtime references)
        if: steps.resources.outputs.origin_deploy_mode != 'steady'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          PLATFORM_WORKER_NAME:
            ${{ steps.platform_config.outputs.platform_worker_name }}
          WRANGLER_CONFIG:
            ${{ steps.platform_config.outputs.platform_bootstrap_wrangler_config
            }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          npm run deploy -- --name "$PLATFORM_WORKER_NAME" --config "$WRANGLER_CONFIG" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}"

      - name: ☁️ Deploy preview runtime Worker
        id: deploy_runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          RUNTIME_WORKER_NAME:
            ${{ steps.runtime_config.outputs.runtime_worker_name }}
          WRANGLER_CONFIG:
            ${{ steps.runtime_config.outputs.runtime_wrangler_config }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "worker_name=$RUNTIME_WORKER_NAME" >> "$GITHUB_OUTPUT"

          is_retryable_deploy_failure() {
            node tools/ci/retry-classifiers.ts deploy deploy-runtime.log
          }

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Runtime deploy attempt $attempt/$deploy_attempts"
            set +e
            npm run deploy -- --name "$RUNTIME_WORKER_NAME" --config "$WRANGLER_CONFIG" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee deploy-runtime.log
            deploy_status="${PIPESTATUS[0]}"
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Runtime deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi

            if ! is_retryable_deploy_failure; then
              echo "Runtime deploy failed with a non-retryable error." >&2
              exit "$deploy_status"
            fi

            echo "Retryable Cloudflare deploy failure detected; retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

          RUNTIME_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const worker = process.argv[2]; const escaped = worker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); const workerUrlRegex = new RegExp(`https://(?:[a-zA-Z0-9-]+\\.)?${escaped}\\.[a-zA-Z0-9._-]+\\.workers\\.dev`, "g"); const matches = text.match(workerUrlRegex); process.stdout.write(matches?.at(-1) ?? "")' deploy-runtime.log "$RUNTIME_WORKER_NAME")"
          if [ -n "$RUNTIME_URL" ]; then
            echo "url=$RUNTIME_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: ☁️ Deploy preview platform Worker
        id: deploy_platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          PLATFORM_WORKER_NAME:
            ${{ steps.platform_config.outputs.platform_worker_name }}
          WRANGLER_CONFIG:
            ${{ steps.platform_config.outputs.platform_wrangler_config }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "worker_name=$PLATFORM_WORKER_NAME" >> "$GITHUB_OUTPUT"

          is_retryable_deploy_failure() {
            node tools/ci/retry-classifiers.ts deploy deploy-platform.log
          }

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Platform deploy attempt $attempt/$deploy_attempts"
            set +e
            npm run deploy -- --name "$PLATFORM_WORKER_NAME" --config "$WRANGLER_CONFIG" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee deploy-platform.log
            deploy_status="${PIPESTATUS[0]}"
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Platform deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi

            if ! is_retryable_deploy_failure; then
              echo "Platform deploy failed with a non-retryable error." >&2
              exit "$deploy_status"
            fi

            echo "Retryable Cloudflare deploy failure detected; retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

          PLATFORM_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const worker = process.argv[2]; const escaped = worker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); const workerUrlRegex = new RegExp(`https://(?:[a-zA-Z0-9-]+\\.)?${escaped}\\.[a-zA-Z0-9._-]+\\.workers\\.dev`, "g"); const matches = text.match(workerUrlRegex); process.stdout.write(matches?.at(-1) ?? "")' deploy-platform.log "$PLATFORM_WORKER_NAME")"
          if [ -n "$PLATFORM_URL" ]; then
            echo "url=$PLATFORM_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: ☁️ Deploy preview app Worker
        id: deploy_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
          ORIGIN_DEPLOY_MODE: ${{ steps.resources.outputs.origin_deploy_mode }}
          ORIGIN_ENTRY: ${{ steps.resources.outputs.origin_entry }}
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          APP_DEPLOY_INFO: ${{ steps.deploy_info.outputs.app_deploy_info }}
        run: |
          set -euo pipefail
          echo "worker_name=$APP_WORKER_NAME" >> "$GITHUB_OUTPUT"
          echo "Origin deploy: ${ORIGIN_ENTRY} entry (${ORIGIN_DEPLOY_MODE} preview fleet)"

          is_retryable_deploy_failure() {
            node tools/ci/retry-classifiers.ts deploy deploy.log
          }

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "Origin deploy attempt $attempt/$deploy_attempts"
            set +e
            npm run deploy -- --name "$APP_WORKER_NAME" --config "$WRANGLER_CONFIG" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" --var "APP_DEPLOY_INFO:${APP_DEPLOY_INFO}" ${APP_BASE_URL:+--var "APP_BASE_URL:${APP_BASE_URL}"} 2>&1 | tee deploy.log
            deploy_status="${PIPESTATUS[0]}"
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "Origin deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi

            if ! is_retryable_deploy_failure; then
              echo "Origin deploy failed with a non-retryable error." >&2
              exit "$deploy_status"
            fi

            echo "Retryable Cloudflare deploy failure detected; retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

          PREVIEW_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const worker = process.argv[2]; const escaped = worker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); const workerUrlRegex = new RegExp(`https://(?:[a-zA-Z0-9-]+\\.)?${escaped}\\.[a-zA-Z0-9._-]+\\.workers\\.dev`, "g"); const matches = text.match(workerUrlRegex); process.stdout.write(matches?.at(-1) ?? "")' deploy.log "$APP_WORKER_NAME")"
          if [ -n "$PREVIEW_URL" ]; then
            echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          fi
          PREVIEW_VERSION_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const match = text.match(/(?:Version\s+)?Preview URL:\s*(https:\/\/\S+)/i); process.stdout.write(match?.[1] ?? "")' deploy.log)"
          if [ -n "$PREVIEW_VERSION_URL" ]; then
            echo "version_preview_url=$PREVIEW_VERSION_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: ☁️ Deploy preview jobs worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
          WRANGLER_CONFIG:
            ${{ steps.jobs_resources.outputs.jobs_wrangler_config }}
        run: |
          set -euo pipefail
          node ./wrangler-env.ts deploy --config "$WRANGLER_CONFIG" --name "${APP_WORKER_NAME}-jobs" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}"

      # The API edge binds the app worker's KodyApi entrypoint, so it deploys
      # after the app worker exists.
      - name: ☁️ Deploy preview API worker
        id: deploy_api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
        run: |
          set -euo pipefail
          API_WORKER_NAME="${APP_WORKER_NAME}-api"
          API_CONFIG="packages/api-worker/wrangler-preview.generated.json"
          node tools/ci/api-worker-config.ts --worker-name "$API_WORKER_NAME" --app-worker-name "$APP_WORKER_NAME" --out-config "$API_CONFIG"
          echo "worker_name=$API_WORKER_NAME" >> "$GITHUB_OUTPUT"

          is_retryable_deploy_failure() {
            node tools/ci/retry-classifiers.ts deploy deploy-api.log
          }

          deploy_attempts=3
          deploy_delay_seconds=10
          for attempt in $(seq 1 "$deploy_attempts"); do
            echo "API deploy attempt $attempt/$deploy_attempts"
            set +e
            node ./wrangler-env.ts deploy --config "$API_CONFIG" --env preview --name "$API_WORKER_NAME" --var "APP_COMMIT_SHA:${DEPLOY_COMMIT_SHA}" 2>&1 | tee deploy-api.log
            deploy_status="${PIPESTATUS[0]}"
            set -e

            if [ "$deploy_status" -eq 0 ]; then
              break
            fi

            if [ "$attempt" -eq "$deploy_attempts" ]; then
              echo "API deploy failed after $deploy_attempts attempts." >&2
              exit "$deploy_status"
            fi

            if ! is_retryable_deploy_failure; then
              echo "API deploy failed with a non-retryable error." >&2
              exit "$deploy_status"
            fi

            echo "Retryable Cloudflare deploy failure detected; retrying in ${deploy_delay_seconds}s."
            sleep "$deploy_delay_seconds"
            deploy_delay_seconds=$((deploy_delay_seconds * 2))
          done

          API_URL="$(node -e 'const fs = require("node:fs"); const text = fs.readFileSync(process.argv[1], "utf8").replace(/\u001b\[[0-9;]*m/g, ""); const worker = process.argv[2]; const escaped = worker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); const workerUrlRegex = new RegExp(`https://(?:[a-zA-Z0-9-]+\\.)?${escaped}\\.[a-zA-Z0-9._-]+\\.workers\\.dev`, "g"); const matches = text.match(workerUrlRegex); process.stdout.write(matches?.at(-1) ?? "")' deploy-api.log "$API_WORKER_NAME")"
          if [ -n "$API_URL" ]; then
            echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔐 Sync preview app Worker secrets (bulk)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
          OVERRIDES_FILE: ${{ steps.deploy_mocks.outputs.overrides_file }}
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
          RUNTIME_WORKER_NAME:
            ${{ steps.runtime_config.outputs.runtime_worker_name }}
          RUNTIME_WRANGLER_CONFIG:
            ${{ steps.runtime_config.outputs.runtime_wrangler_config }}
          PLATFORM_WORKER_NAME:
            ${{ steps.platform_config.outputs.platform_worker_name }}
          PLATFORM_WRANGLER_CONFIG:
            ${{ steps.platform_config.outputs.platform_wrangler_config }}
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID_PREVIEW }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          set -euo pipefail
          ENV_FILE="packages/worker/.env.example"
          if [ ! -f "$ENV_FILE" ]; then
            echo "Missing $ENV_FILE (required for preview deploy secrets)." >&2
            exit 1
          fi
          if [ ! -f "$OVERRIDES_FILE" ]; then
            echo "Missing overrides file ($OVERRIDES_FILE) from mock deploy step." >&2
            exit 1
          fi

          extra_args=()
          if [ -n "${PREVIEW_URL:-}" ]; then
            extra_args+=(--set "APP_BASE_URL=$PREVIEW_URL")
          fi

          # Both workers must share the session-signing and secret-store keys:
          # the runtime worker reads app-origin session cookies for inline
          # package apps and package-app handoffs.
          PREVIEW_COOKIE_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$PREVIEW_COOKIE_SECRET"
          extra_args+=(--set "COOKIE_SECRET=$PREVIEW_COOKIE_SECRET")

          # Origin-only maintenance secret for this deploy's builtin
          # capability reindex into the preview's own Vectorize index, fresh
          # per deploy.
          PREVIEW_REINDEX_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$PREVIEW_REINDEX_SECRET"
          printf '%s' "$PREVIEW_REINDEX_SECRET" > "$RUNNER_TEMP/capability-reindex-secret"
          app_extra_args=("${extra_args[@]}" --set "CAPABILITY_REINDEX_SECRET=$PREVIEW_REINDEX_SECRET")

          # Intentionally omit KIT_API_KEY so preview/E2E do not write to
          # production Kit.
          # CLOUDFLARE_ARTIFACTS_API_TOKEN carries the real deploy token so
          # Artifacts createToken/fork REST hits api.cloudflare.com while
          # CLOUDFLARE_API_TOKEN stays the per-PR mock credential for email.
          node tools/ci/sync-worker-secrets.ts --env "" --name "$APP_WORKER_NAME" --config "$WRANGLER_CONFIG" --from-dotenv "$ENV_FILE" --from-dotenv "$OVERRIDES_FILE" --set-from-env-optional AI_GATEWAY_ID --set-from-env-optional SENTRY_DSN --set-from-env-optional YOUTUBE_DATA_API_KEY --set-from-env-optional CLOUDFLARE_ARTIFACTS_API_TOKEN=CLOUDFLARE_API_TOKEN --include-empty "${app_extra_args[@]}"
          # The runtime worker intentionally reuses the same dotenv-based sync
          # here (unlike production, which uses a strict runtime-lane
          # allowlist): the preview values are .env.example placeholders plus
          # per-PR mock-endpoint overrides — capability execution on the
          # runtime worker needs the mock endpoints, and no production secret
          # is present in either file.
          node tools/ci/sync-worker-secrets.ts --env "" --name "$RUNTIME_WORKER_NAME" --config "$RUNTIME_WRANGLER_CONFIG" --from-dotenv "$ENV_FILE" --from-dotenv "$OVERRIDES_FILE" --set-from-env-optional AI_GATEWAY_ID --set-from-env-optional SENTRY_DSN --set-from-env-optional CLOUDFLARE_ARTIFACTS_API_TOKEN=CLOUDFLARE_API_TOKEN --include-empty "${extra_args[@]}"
          node tools/ci/sync-worker-secrets.ts --env "" --name "$PLATFORM_WORKER_NAME" --config "$PLATFORM_WRANGLER_CONFIG" --from-dotenv "$ENV_FILE" --from-dotenv "$OVERRIDES_FILE" --set-from-env-optional AI_GATEWAY_ID --set-from-env-optional SENTRY_DSN --set-from-env-optional CLOUDFLARE_ARTIFACTS_API_TOKEN=CLOUDFLARE_API_TOKEN --include-empty "${extra_args[@]}"

      - name: 📤 Upload Worker source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT:-}" ]; then
            echo "Skipping Sentry source map upload (set SENTRY_AUTH_TOKEN secret and SENTRY_ORG / SENTRY_PROJECT repo variables)."
            exit 0
          fi
          npm run sentry:upload-sourcemaps

      - name: 🌱 Seed preview test data
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ENV: preview
          WRANGLER_CONFIG: ${{ steps.resources.outputs.wrangler_config }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          labels_json="${PR_LABELS_JSON}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${PR_NUMBER}" ]; then
            labels_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"
          fi
          if [ -z "$labels_json" ] || [ "$labels_json" = "null" ]; then
            labels_json='[]'
          fi
          set +e
          flag_keys_text="$(node tools/preview-seed-flags.ts --labels "$labels_json")"
          flag_status=$?
          set -e
          if [ "$flag_status" -ne 0 ]; then
            exit "$flag_status"
          fi
          flag_args=()
          if [ -n "$flag_keys_text" ]; then
            while IFS= read -r key; do
              if [ -n "$key" ]; then
                flag_args+=(--enable-flag "$key")
              fi
            done <<< "$flag_keys_text"
          fi
          node tools/seed-test-data.ts --remote --config "$WRANGLER_CONFIG" --email me@kentcdodds.com --password ilikecode "${flag_args[@]}"

      - name: 🩺 Healthcheck (preview)
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "Missing preview URL output; cannot run healthcheck." >&2
            exit 1
          fi

          if [ -z "${EXPECTED_COMMIT_SHA:-}" ]; then
            echo "Missing expected commit SHA; cannot verify deployment version." >&2
            exit 1
          fi

          HEALTHCHECK_URL="${PREVIEW_URL%/}/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=30
          delay_seconds=3

          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > health.json && \
              node -e "const fs = require('node:fs'); const body = fs.readFileSync('health.json','utf8'); const json = JSON.parse(body); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true) { console.error('healthcheck-unexpected-response', json); process.exit(1); } if (json?.commitSha !== expected) { console.error('healthcheck-unexpected-commit-sha', { expected, actual: json?.commitSha }); process.exit(1); } console.log('healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Healthcheck failed after ${attempts} attempts: $HEALTHCHECK_URL" >&2
          if [ -f health.json ]; then
            echo "Last response body:" >&2
            cat health.json >&2
          fi
          exit 1

      # Each preview owns its Vectorize index, so builtin capability vectors are
      # written here. --force because APP_DB embed fingerprints can outlive the
      # index (an existing preview's first deploy onto its own index, or a
      # deploy that failed between ensure and this step) and would skip the
      # upserts. The secret was synced after the app deploy and takes a few
      # seconds to reach the edge, hence --auth-retry-seconds.
      - name: 🧭 Reindex builtin capability vectors (preview Vectorize)
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
        run: |
          set -euo pipefail
          CAPABILITY_REINDEX_SECRET="$(cat "$RUNNER_TEMP/capability-reindex-secret")"
          export CAPABILITY_REINDEX_SECRET
          node tools/ci/reindex-capabilities.ts --url "$PREVIEW_URL" --phases capabilities --force --auth-retry-seconds 90

      - name: 🩺 Healthcheck platform worker (preview)
        shell: bash
        env:
          PLATFORM_URL: ${{ steps.deploy_platform.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${PLATFORM_URL:-}" ]; then
            echo "Missing platform worker preview URL output; cannot run healthcheck." >&2
            exit 1
          fi

          if [ -z "${EXPECTED_COMMIT_SHA:-}" ]; then
            echo "Missing expected commit SHA; cannot verify platform deployment version." >&2
            exit 1
          fi

          HEALTHCHECK_URL="${PLATFORM_URL%/}/__platform/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=30
          delay_seconds=3

          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > platform-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('platform-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.status !== 'ok') { console.error('platform-healthcheck-unexpected-response', json); process.exit(1); } if (json?.commitSha !== expected) { console.error('platform-healthcheck-unexpected-commit-sha', { expected, actual: json?.commitSha }); process.exit(1); } if (json?.cookieSecretConfigured !== true) { console.error('platform-healthcheck-missing-cookie-secret', json); process.exit(1); } console.log('platform-healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Platform worker healthcheck failed after ${attempts} attempts: $HEALTHCHECK_URL" >&2
          if [ -f platform-health.json ]; then
            echo "Last response body:" >&2
            cat platform-health.json >&2
          fi
          exit 1

      - name: 🩺 Healthcheck runtime worker (preview)
        shell: bash
        env:
          RUNTIME_URL: ${{ steps.deploy_runtime.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${RUNTIME_URL:-}" ]; then
            echo "Missing runtime worker preview URL output; cannot run healthcheck." >&2
            exit 1
          fi

          if [ -z "${EXPECTED_COMMIT_SHA:-}" ]; then
            echo "Missing expected commit SHA; cannot verify runtime deployment version." >&2
            exit 1
          fi

          HEALTHCHECK_URL="${RUNTIME_URL%/}/__runtime/health"
          echo "Healthcheck URL: $HEALTHCHECK_URL"

          attempts=30
          delay_seconds=3

          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --location --max-time 10 \
              --header "Accept: application/json" \
              "$HEALTHCHECK_URL" > runtime-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('runtime-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.status !== 'ok') { console.error('runtime-healthcheck-unexpected-response', json); process.exit(1); } if (json?.commitSha !== expected) { console.error('runtime-healthcheck-unexpected-commit-sha', { expected, actual: json?.commitSha }); process.exit(1); } if (json?.cookieSecretConfigured !== true) { console.error('runtime-healthcheck-missing-cookie-secret', json); process.exit(1); } console.log('runtime-healthcheck-ok', json);"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "Runtime worker healthcheck failed after ${attempts} attempts: $HEALTHCHECK_URL" >&2
          if [ -f runtime-health.json ]; then
            echo "Last response body:" >&2
            cat runtime-health.json >&2
          fi
          exit 1

      # Origin + platform + runtime are the core preview. Mark healthy here so
      # a later API healthcheck that loses the job budget does not tear the
      # usable fleet down (#3495).
      - name: ✅ Mark preview healthy
        id: preview_healthy
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 🩺 Healthcheck API worker (preview)
        shell: bash
        env:
          API_URL: ${{ steps.deploy_api.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          CORE_HEALTHY: ${{ steps.preview_healthy.outputs.ok }}
        run: |
          set -euo pipefail

          soft_fail_if_core_healthy() {
            if [ "${CORE_HEALTHY:-}" = "true" ]; then
              echo "::warning::API worker healthcheck did not pass, but origin/platform/runtime are healthy; leaving the preview up." >&2
              exit 0
            fi
            exit 1
          }

          if [ -z "${API_URL:-}" ]; then
            echo "Missing API worker preview URL output; cannot run healthcheck." >&2
            soft_fail_if_core_healthy
          fi

          attempts=30
          delay_seconds=3

          for i in $(seq 1 "$attempts"); do
            echo "Attempt $i/$attempts"
            if curl --fail --silent --show-error --max-time 10 \
              --header "Accept: application/json" \
              "${API_URL%/}/health" > api-health.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('api-health.json','utf8')); const expected = process.env.EXPECTED_COMMIT_SHA; if (json?.ok !== true || json?.commit !== expected) { console.error('api-healthcheck-unexpected-response', { expected, json }); process.exit(1); } console.log('api-healthcheck-ok', json);" && \
              curl --fail --silent --show-error --max-time 20 \
                --header "Accept: application/json" \
                "${API_URL%/}/openapi.json" > api-openapi.json && \
              node -e "const fs = require('node:fs'); const json = JSON.parse(fs.readFileSync('api-openapi.json','utf8')); if (!json?.openapi?.startsWith('3.') || !json?.paths?.['/v1/capability-proxy/session']) { console.error('api-openapi-unexpected-response', Object.keys(json ?? {})); process.exit(1); } console.log('api-openapi-ok', json.openapi, Object.keys(json.paths).length, 'paths');"; then
              exit 0
            fi
            sleep "$delay_seconds"
          done

          echo "API worker healthcheck failed after ${attempts} attempts: $API_URL" >&2
          soft_fail_if_core_healthy

      - name: 🧾 Write preview link summary
        if: steps.deploy_preview.outputs.url != ''
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
          PREVIEW_VERSION_URL:
            '${{ steps.deploy_preview.outputs.version_preview_url }}'
          WORKER_NAME: ${{ steps.deploy_preview.outputs.worker_name }}
          PLATFORM_WORKER_NAME: ${{ steps.deploy_platform.outputs.worker_name }}
          PLATFORM_URL: ${{ steps.deploy_platform.outputs.url }}
          RUNTIME_WORKER_NAME: ${{ steps.deploy_runtime.outputs.worker_name }}
          RUNTIME_URL: ${{ steps.deploy_runtime.outputs.url }}
          API_WORKER_NAME: ${{ steps.deploy_api.outputs.worker_name }}
          API_URL: ${{ steps.deploy_api.outputs.url }}
          MOCK_SUMMARY: ${{ steps.deploy_mocks.outputs.mock_summary }}
          D1_DATABASE_NAME: ${{ steps.resources.outputs.d1_database_name }}
          JOBS_D1_DATABASE_NAME:
            ${{ steps.resources.outputs.jobs_d1_database_name }}
          VECTORIZE_INDEX_NAME:
            ${{ steps.resources.outputs.vectorize_index_name }}
          OAUTH_KV_TITLE: ${{ steps.resources.outputs.oauth_kv_title }}
        run: |
          {
            echo "### Preview"
            echo ""
            echo "$PREVIEW_URL"
            echo ""
            printf 'Worker: `%s`\n' "$WORKER_NAME"
            if [ -n "${PLATFORM_URL:-}" ]; then
              printf 'Platform worker: `%s` (%s)\n' "$PLATFORM_WORKER_NAME" "$PLATFORM_URL"
            fi
            if [ -n "${RUNTIME_URL:-}" ]; then
              printf 'Runtime worker: `%s` (%s)\n' "$RUNTIME_WORKER_NAME" "$RUNTIME_URL"
            fi
            if [ -n "${API_URL:-}" ]; then
              printf 'API worker: `%s` (%s)\n' "$API_WORKER_NAME" "$API_URL"
            fi
            if [ -n "${PREVIEW_VERSION_URL:-}" ]; then
              printf 'Version preview: %s\n' "$PREVIEW_VERSION_URL"
            fi
            if [ -n "${D1_DATABASE_NAME:-}" ]; then
              printf 'D1: `%s`\n' "$D1_DATABASE_NAME"
            fi
            if [ -n "${JOBS_D1_DATABASE_NAME:-}" ]; then
              printf 'Jobs D1: `%s`\n' "$JOBS_D1_DATABASE_NAME"
            fi
            if [ -n "${VECTORIZE_INDEX_NAME:-}" ]; then
              printf 'Vectorize: `%s`\n' "$VECTORIZE_INDEX_NAME"
            fi
            if [ -n "${OAUTH_KV_TITLE:-}" ]; then
              printf 'KV: `%s`\n' "$OAUTH_KV_TITLE"
            fi
            if [ -n "${MOCK_SUMMARY:-}" ]; then
              echo ""
              echo "### Mocks"
              printf '%s\n' "$MOCK_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 💬 Comment Preview URL on PR
        if: >-
          github.event_name == 'pull_request' &&
          steps.deploy_preview.outputs.url != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.url }}
          PREVIEW_VERSION_URL:
            '${{ steps.deploy_preview.outputs.version_preview_url }}'
          WORKER_NAME: ${{ steps.deploy_preview.outputs.worker_name }}
          PLATFORM_WORKER_NAME: ${{ steps.deploy_platform.outputs.worker_name }}
          PLATFORM_URL: ${{ steps.deploy_platform.outputs.url }}
          RUNTIME_WORKER_NAME: ${{ steps.deploy_runtime.outputs.worker_name }}
          RUNTIME_URL: ${{ steps.deploy_runtime.outputs.url }}
          API_WORKER_NAME: ${{ steps.deploy_api.outputs.worker_name }}
          API_URL: ${{ steps.deploy_api.outputs.url }}
          MOCK_SUMMARY: ${{ steps.deploy_mocks.outputs.mock_comment_summary }}
          D1_DATABASE_NAME: ${{ steps.resources.outputs.d1_database_name }}
          OAUTH_KV_TITLE: ${{ steps.resources.outputs.oauth_kv_title }}
        with:
          script: |
            const marker = "<!-- kody-preview-url -->";
            const previewUrl = process.env.PREVIEW_URL;
            const loginDeepLink = `${previewUrl}/login?redirectTo=${encodeURIComponent("/account")}`;
            const bodyLines = [
              marker,
              `🔎 Preview deployed: ${previewUrl}`,
              "",
              `Worker: \`${process.env.WORKER_NAME}\``,
            ];
            if (process.env.PLATFORM_URL?.trim()) {
              bodyLines.push(
                `Platform worker: \`${process.env.PLATFORM_WORKER_NAME}\` (${process.env.PLATFORM_URL.trim()})`,
              );
            }
            if (process.env.RUNTIME_URL?.trim()) {
              bodyLines.push(
                `Runtime worker: \`${process.env.RUNTIME_WORKER_NAME}\` (${process.env.RUNTIME_URL.trim()})`,
              );
            }
            if (process.env.API_URL?.trim()) {
              bodyLines.push(
                `API worker: \`${process.env.API_WORKER_NAME}\` (${process.env.API_URL.trim()})`,
              );
            }
            if (process.env.PREVIEW_VERSION_URL?.trim()) {
              bodyLines.push(
                `Version preview: ${process.env.PREVIEW_VERSION_URL.trim()}`,
              );
            }
            if (process.env.D1_DATABASE_NAME?.trim()) {
              bodyLines.push(`D1: \`${process.env.D1_DATABASE_NAME.trim()}\``);
            }
            if (process.env.OAUTH_KV_TITLE?.trim()) {
              bodyLines.push(`KV: \`${process.env.OAUTH_KV_TITLE.trim()}\``);
            }
            bodyLines.push(
              "",
              "### Seed login (public preview fixture)",
              "",
              "- Email: `me@kentcdodds.com`",
              "- Password: `ilikecode`",
              "- Username: `user-me`",
              "",
              "Prefer MCP/API/`control-kody` execute for proof. Browser only when UI is under test.",
              "",
              `- Deep link (UI login still needed): [Sign in → /account](${loginDeepLink}) — change \`redirectTo\` to the path under test (for example \`/@user-me/your-pkg\`).`,
              `- Already signed in (reuse CLI cookie): \`npm run control-kody -- browse --origin ${previewUrl} --path /account\``,
              "",
              "Do **not** post session cookies or tokens in PR comments.",
            );
            if (process.env.MOCK_SUMMARY?.trim()) {
              bodyLines.push("");
              bodyLines.push("Mocks:");
              bodyLines.push(process.env.MOCK_SUMMARY.trim());
            }
            const body = bodyLines.join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      # A failed PR preview still holds Workers (and their Durable Object
      # namespaces), D1, KV, and R2 until the PR closes, which can keep the
      # account at its Durable Object namespace cap (#3396). The next push
      # re-creates everything. Branch previews (workflow_dispatch) keep their
      # state so a migration rehearsal can inspect or restore it. A preview
      # that passed its healthchecks stays up even if a later step fails.
      - name: 🧹 Clean up preview resources after a failed deploy
        if: >-
          failure() && github.event_name == 'pull_request' &&
          steps.names.outputs.worker_name != '' &&
          steps.preview_healthy.outputs.ok != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
        run: |
          set -euo pipefail
          node tools/ci/preview-resources.ts cleanup --worker-name "$APP_WORKER_NAME"

  cleanup:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🧹 Cleanup Preview Resources
    timeout-minutes: 4
    permissions:
      contents: read
      deployments: write
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.action == 'closed' &&
        github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.action == 'cleanup')
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🧾 Resolve preview names
        id: names
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_PREVIEW_NAME: ${{ inputs.preview_name }}
        run: |
          set -euo pipefail
          APP_NAME="kody"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PREVIEW_KIND="pr"
            PREVIEW_ID="$PR_NUMBER"
          else
            PREVIEW_KIND="$INPUT_TARGET"
            PREVIEW_ID=""
            if [ "$PREVIEW_KIND" = "pr" ]; then
              PREVIEW_ID="$INPUT_PR_NUMBER"
              if [ -z "$PREVIEW_ID" ]; then
                echo "inputs.pr_number is required when inputs.target=pr" >&2
                exit 1
              fi
            else
              PREVIEW_ID="$INPUT_PREVIEW_NAME"
              if [ -z "$PREVIEW_ID" ]; then
                PREVIEW_ID="$REF_NAME"
              fi
            fi
          fi

          slug="$(echo "$PREVIEW_ID" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' | cut -c1-32)"
          if [ -z "$slug" ]; then
            slug="preview"
          fi

          if [ "$PREVIEW_KIND" = "pr" ]; then
            APP_WORKER_NAME="${APP_NAME}-pr-${slug}"
          else
            APP_WORKER_NAME="${APP_NAME}-branch-${slug}"
          fi

          echo "worker_name=$APP_WORKER_NAME" >> "$GITHUB_OUTPUT"

      - name: 🧹 Delete preview Workers and resources (D1 + KV + R2 + Vectorize)
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_WORKER_NAME: ${{ steps.names.outputs.worker_name }}
        run: |
          set -euo pipefail
          node tools/ci/preview-resources.ts cleanup --worker-name "$APP_WORKER_NAME"

      - name: 🗑️ Delete GitHub preview deployments
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const eventName = process.env.EVENT_NAME;
            let envName;
            if (eventName === "pull_request") {
              const n = process.env.PR_NUMBER;
              if (!n) {
                core.info("No PR number on event; skipping GitHub deployment delete.");
                return;
              }
              envName = `preview-${n}`;
            } else if (
              eventName === "workflow_dispatch" &&
              process.env.INPUT_TARGET === "pr"
            ) {
              const n = process.env.INPUT_PR_NUMBER;
              if (!n) {
                core.info(
                  "Manual cleanup without pr_number; skipping GitHub deployment delete.",
                );
                return;
              }
              envName = `preview-${n}`;
            } else {
              core.info(
                "Skipping GitHub deployment delete (branch-targeted cleanups use a different naming scheme).",
              );
              return;
            }

            const { owner, repo } = context.repo;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                environment: envName,
                per_page: 100,
              },
            );

            for (const deployment of deployments) {
              try {
                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  description: "Cleaning up closed PR preview deployment.",
                });
                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                });
              }
            }

            core.notice(
              `Deleted ${deployments.length} GitHub preview deployment(s) for ${envName}.`,
            );

      # Preview deploys no longer create per-PR GitHub Environments. Keep this
      # step so open-PR leftovers (and any race-recreated `preview-<n>`) still go
      # away when the PR closes. Best-effort: a missing or under-scoped
      # PREVIEW_ENVIRONMENT_ADMIN_TOKEN is a warning, not a red X on a closed
      # PR. Worker/D1/KV/R2/Vectorize and deployment cleanup above stay strict.
      - name: 🏷️ Delete GitHub preview environment
        if: always()
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          HAS_PREVIEW_ENVIRONMENT_ADMIN_TOKEN:
            ${{ secrets.PREVIEW_ENVIRONMENT_ADMIN_TOKEN != '' && 'true' ||
            'false' }}
        with:
          github-token:
            ${{ secrets.PREVIEW_ENVIRONMENT_ADMIN_TOKEN || github.token }}
          script: |
            const eventName = process.env.EVENT_NAME;
            const hasAdminToken =
              process.env.HAS_PREVIEW_ENVIRONMENT_ADMIN_TOKEN === "true";
            let envName;
            if (eventName === "pull_request") {
              const n = process.env.PR_NUMBER;
              if (!n) {
                core.info("No PR number on event; skipping GitHub environment delete.");
                return;
              }
              envName = `preview-${n}`;
            } else if (
              eventName === "workflow_dispatch" &&
              process.env.INPUT_TARGET === "pr"
            ) {
              const n = process.env.INPUT_PR_NUMBER;
              if (!n) {
                core.info(
                  "Manual cleanup without pr_number; skipping GitHub environment delete.",
                );
                return;
              }
              envName = `preview-${n}`;
            } else {
              core.info(
                "Skipping GitHub environment delete (branch-targeted cleanups use a different naming scheme).",
              );
              return;
            }

            if (!hasAdminToken) {
              core.warning(
                `PREVIEW_ENVIRONMENT_ADMIN_TOKEN is required to delete leftover GitHub preview environment ${envName}. Configure it with repository administration write access.`,
              );
              return;
            }

            const { owner, repo } = context.repo;
            try {
              await github.request(
                "DELETE /repos/{owner}/{repo}/environments/{environment_name}",
                {
                  owner,
                  repo,
                  environment_name: envName,
                },
              );
              core.notice(`Deleted GitHub environment: ${envName}`);
            } catch (e) {
              if (e.status === 404) {
                core.warning(
                  `Could not confirm deletion of GitHub environment ${envName}; it may already be absent or the token may lack access.`,
                );
              } else if (
                e.status === 403 &&
                e.response?.headers?.["x-accepted-github-permissions"] ===
                  "administration=write"
              ) {
                core.warning(
                  `PREVIEW_ENVIRONMENT_ADMIN_TOKEN cannot delete ${envName}; it must allow repository administration write access.`,
                );
              } else {
                throw e;
              }
            }
