name: Report merge conflicts

# pull_request workflows do not start when GitHub cannot build the merge
# commit (mergeable_state=dirty). This file lives on the default branch and
# still runs. The job stays green: a pull_request_target or push run is
# recorded on the default-branch SHA, and a failed job would mark that commit
# failed. A GitHub API rate limit is deferred the same way (exit 0; write
# the head check only after mergeability is known) so the installation
# quota cannot redden main or leave an in-progress check.
# The script writes 🚧 Merge conflicts on each pull request head SHA,
# which is what `gh pr checks` reads, and skips a head with no commits
# ahead of the base so that check cannot land on a default-branch SHA.
# A push to the base branch and a base retarget rerun that check, because
# the head commit does not move in those cases. pull_request_target has no
# branches filter: GitHub matches that
# filter on the new base, so a retarget away from the default branch would
# never start and the previous head check would stay in place. The job
# never checks out or executes pull request code.
on:
  push:
    branches:
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  merge-conflicts:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: Report merge conflicts
    timeout-minutes: 15
    # Title and body edits do not change mergeability. Pull requests that
    # do not target the default branch are skipped, except an edit that just
    # moved one off that branch: the head SHA is unchanged, so this run
    # replaces the previous check with the result against the new base.
    if: >-
      github.event_name == 'push' || (
        (
          github.event.pull_request.base.ref == github.event.repository.default_branch ||
          github.event.changes.base.ref.from == github.event.repository.default_branch
        ) &&
        (github.event.action != 'edited' || github.event.changes.base)
      )
    steps:
      - name: 📦 Checkout default branch
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: 🚧 Report merge conflicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_CONFLICT_MODE: >-
            ${{ github.event_name == 'push' && 'open-pulls' || 'pull-request' }}
          BASE_REF: >-
            ${{ github.event_name == 'push' && github.ref_name ||
            github.event.pull_request.base.ref }}
          BASE_SHA: >-
            ${{ github.event_name == 'push' && github.sha ||
            github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/ci/merge-conflict-check.ts
