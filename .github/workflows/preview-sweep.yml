name: 🧹 Preview Sweep

# Removes Cloudflare resources left by PR previews whose PR is closed but whose
# close-time cleanup never ran or failed (#3396), and by branch previews whose
# worker is already gone (#3563) or whose source branch's PRs are all closed
# (#3707). Leftover preview Workers keep their Durable
# Object namespaces until the account cap blocks new previews.
# tools/ci/preview-sweep.ts only deletes kody-pr-<number>* and
# kody-branch-<slug>* names, through the preview naming guard in
# tools/ci/preview-resources.ts. Branch candidates are discovered from
# Worker, Durable Object, D1, KV, and R2 names, but liveness is judged only
# from the Worker scripts listing; branch sweeping is skipped entirely for a
# run if a workflow_dispatch preview.yml deploy (the only kind that creates
# branch previews) is queued or in progress, since a deploy provisions
# D1/KV/R2 before uploading its Worker.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      max:
        description: Most closed-PR previews to clean up in this run
        required: false
        type: string
        default: '10'
      dry_run:
        description: List what would be swept without deleting anything
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  # Lets tools/ci/preview-sweep.ts check for an in-progress preview.yml run
  # before sweeping any branch preview (review follow-up on #3563).
  actions: read

concurrency:
  group: preview-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    name: 🧹 Sweep closed-PR previews
    # Each preview cleanup has a 150s budget (previewCleanupBudgetMsDefault).
    # preview-sweep.ts also tracks its own 30-minute wall-clock budget
    # (previewSweepWallClockBudgetMsDefault) shared across PR and branch
    # cleanups in one run, deferring whatever does not fit to the next run,
    # leaving room here for npm ci and the account-wide listing calls.
    timeout-minutes: 40
    if: github.repository == 'kody-hq/kody'
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🧹 Clean up previews of closed PRs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_PREVIEWS: ${{ inputs.max || '10' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          args=(--max "$MAX_PREVIEWS")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node tools/ci/preview-sweep.ts "${args[@]}"
