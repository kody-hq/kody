name: ci-review diag (temporary)

on:
  push:
    branches: [ci-review/2026-11-09-speed]

permissions:
  contents: read

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, defender-off]
    runs-on: windows-11-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      NPM_CONFIG_SCRIPT_SHELL: C:\Program Files\Git\bin\bash.exe
    steps:
      - name: Defender status
        shell: pwsh
        run: Get-MpComputerStatus | Select-Object AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,OnAccessProtectionEnabled,IoavProtectionEnabled,BehaviorMonitorEnabled | Format-List
      - name: Disable Defender real-time scanning
        if: matrix.variant == 'defender-off'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled | Format-List
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - name: npm ci (foreground scripts, timing)
        run: npm ci --foreground-scripts --timing --loglevel=http
      - name: npm timing summary
        if: always()
        run: |
          cd "$(npm config get cache)/_logs"
          ls -la
          for f in *-timing.json; do node -e 'const t=require(process.argv[1]); const e=Object.entries(t.timers||t).filter(([k,v])=>typeof v==="number").sort((a,b)=>b[1]-a[1]).slice(0,40); for (const [k,v] of e) console.log(String(v).padStart(8),k)' "$PWD/$f"; done
          grep -h "timing" *-debug-0.log | sort -t' ' -k5 -n -r | head -40 || true
