name: Desktop release runner watch

# A Desktop release build leg that never gets a hosted runner (usually macOS
# arm64 capacity) leaves the draft without that target. This re-runs the failed
# jobs of that run until every leg builds, and fails naming the missing targets
# when a leg failed for a real reason or attempts run out
# (packages/desktop/scripts/release-runner-watch.cjs).
on:
  workflow_run:
    workflows: [Desktop release]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: desktop-release-watch-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  watch:
    # Attempts this job starts itself are watched by the same job.
    if:
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.triggering_actor.login != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Re-run build legs no runner picked up
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node packages/desktop/scripts/release-runner-watch.cjs
