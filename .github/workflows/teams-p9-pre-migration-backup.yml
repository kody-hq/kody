name: 🛟 Teams P9 Pre-Migration D1 Bookmarks

# Seals read-only D1 Time Travel bookmarks (APP_DB, AUDIT_DB, JOBS_DB) before
# the Teams P9 contract deploy. Does not write to D1. Production runs are
# kentcdodds, cursor (Cloud Agent gh user), or kody-bot (operator GitHub
# connector via @kentcdodds/github). Artifacts are sealed to
# recipient_public_key.

on:
  workflow_dispatch:
    inputs:
      target:
        description:
          production, a branch preview (kody-branch-<slug>), or the slug
          preview.yml used (cig-0110 → kody-branch-cig-0110)
        required: true
        type: string
        default: production
      recipient_public_key:
        description:
          base64 SPKI public key from `node tools/preview-rehearsal/seal.ts
          keygen`
        required: true
        type: string
      confirm:
        description: production — type "teams p9 pre-migration bookmarks"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group:
    teams-p9-pre-migration-backup-${{ inputs.target == 'production' &&
    'production' || (startsWith(inputs.target, 'kody-branch-') && inputs.target
    || format('kody-branch-{0}', inputs.target)) }}
  cancel-in-progress: false

jobs:
  bookmarks:
    name: 🛟 Bookmarks on ${{ inputs.target }}
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    timeout-minutes: 20
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
      OUT_DIR: bookmarks-out
    steps:
      - name: 🛂 Check who may run production
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The CI token reaches production for every target, so only main's
          # reviewed script runs with it.
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Run from main only, got $REF." >&2
            exit 1
          fi
          # Keep in sync with resolveRehearsalWorkerName /
          # preview-rehearsal.yml.
          resolve_branch_preview_target() {
            local raw="$1"
            local name
            name="$(printf '%s' "$raw" | tr '[:upper:]' '[:lower:]' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            if [[ "$name" =~ ^kody-branch-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              printf '%s\n' "$name"
              return
            fi
            if [[ "$name" =~ ^kody-pr-[0-9]+$ ]]; then
              echo "target must be production or a branch preview (kody-branch-<slug> or the slug preview.yml uses), got '$raw'." >&2
              return 1
            fi
            if [[ "$name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              printf '%s\n' "kody-branch-$(printf '%s' "$name" | cut -c1-32)"
              return
            fi
            echo "target must be production or a branch preview (kody-branch-<slug> or the slug preview.yml uses), got '$raw'." >&2
            return 1
          }
          if [ "$TARGET" = "production" ]; then
            # Approved production runners (Kent + Cloud Agent gh user +
            # kody-bot operator connector). Agents dispatch this workflow
            # through @kentcdodds/github as kody-bot; omitting that login
            # fails the first post-merge capture.
            case "$ACTOR" in
              kentcdodds|cursor|kody-bot) ;;
              *)
                echo "Production bookmark capture runs as an approved actor only (kentcdodds, cursor, or kody-bot); got $ACTOR." >&2
                exit 1
                ;;
            esac
            if [ "$CONFIRM" != "teams p9 pre-migration bookmarks" ]; then
              echo 'Production needs confirm = "teams p9 pre-migration bookmarks".' >&2
              exit 1
            fi
          else
            TARGET="$(resolve_branch_preview_target "$TARGET")"
            echo "TARGET=$TARGET" >> "$GITHUB_ENV"
            echo "Resolved target=$TARGET"
          fi

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🛟 Capture sealed D1 bookmarks
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          node tools/teams-migration/production-d1-bookmarks.ts \
            --target "$TARGET" \
            --recipient-public-key "$RECIPIENT_PUBLIC_KEY" \
            --out "$OUT_DIR/d1-bookmarks.sealed.json"

      - name: 🧾 Summary
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## 🛟 Teams P9 pre-migration D1 bookmarks on \`$TARGET\`"
            echo ""
            if [ -f "$OUT_DIR/d1-bookmarks.sealed.json" ]; then
              echo "Artifact \`teams-p9-pre-migration-bookmarks\` (run $RUN_ID) holds the sealed bookmarks. Bookmark strings stay out of this public summary."
              echo ""
              echo "Open with \`node tools/preview-rehearsal/seal.ts open --private-key <key> --in d1-bookmarks.sealed.json --out bookmarks.json\`."
            else
              echo "No sealed bookmarks were written; see the failed step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-p9-pre-migration-bookmarks
          path: bookmarks-out
          if-no-files-found: ignore
          retention-days: 30
