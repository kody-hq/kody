name: 🧪 Wasm production probe

# CI-only production probe for direct WebAssembly support. This workflow lives
# only on its draft PR branch, which must never merge (see the 🚫 job below and
# the ✅ Validate change on the same branch). Each commit that edits
# tools/wasm-probe/run.json runs one mode: permissions, probe, billing, cleanup.
# Every run also sweeps kody-wasm-probe-* Workers older than 24 hours.

on:
  push:
    branches:
      - devin/1795891120-wasm-probe
    paths:
      - tools/wasm-probe/**
      - .github/workflows/wasm-probe.yml
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
        closed,
      ]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: wasm-probe
  cancel-in-progress: false

jobs:
  do_not_merge:
    name: 🚫 do-not-merge (Wasm probe)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::This PR is a CI-only production probe and must never merge into main."
          exit 1

  probe:
    name: 🧪 Probe
    if: github.event_name == 'push' && github.repository == 'kody-hq/kody'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: 🔎 Find probe PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: 🧪 Run probe mode from run.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_PR: ${{ steps.pr.outputs.number }}
        run: node tools/wasm-probe/run.mjs
      - name: 📦 Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-probe-results
          path: wasm-probe-results.json
          if-no-files-found: ignore

  cleanup_on_close:
    name: 🧹 Delete every probe Worker on PR close
    if:
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/wasm-probe/run.mjs cleanup
