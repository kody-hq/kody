name: 🖥️ Execution context e2e

# Runs `kody daemon` on Ubuntu, macOS, and Windows (x64 + arm64) against a PR
# preview: register a throwaway context, execute on it with a host folder,
# stop, assert no workerd is left, revoke and delete. Previews only, never
# production. Agent guide: docs/contributing/execution-context-e2e.md.

on:
  workflow_run:
    workflows: ['🔎 Preview']
    types: [completed]
  workflow_dispatch:
    inputs:
      preview_origin:
        description: Preview app origin (https://kody-<pr>.<sub>.workers.dev)
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      origin: ${{ steps.origin.outputs.origin }}
      sha: ${{ steps.origin.outputs.sha }}
    steps:
      - id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ORIGIN: ${{ inputs.preview_origin }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -n "$INPUT_ORIGIN" ]; then
            echo "origin=$INPUT_ORIGIN" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.head.ref == env.HEAD_BRANCH)][0]')"
          if ! echo "$pr" | jq -e '.labels | map(.name) | index("preview-flag:execution-contexts")' >/dev/null; then
            echo "PR has no preview-flag:execution-contexts label; skipping."
            exit 0
          fi
          number="$(echo "$pr" | jq -r .number)"
          url="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=preview-$number&per_page=1" --jq '.[0].statuses_url' | xargs -r gh api --jq '[.[] | select(.state == "success")][0].environment_url')"
          echo "origin=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  e2e:
    needs: resolve
    if: needs.resolve.outputs.origin != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    name: 🖥️ e2e (${{ matrix.runner }})
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @kodycodes/cli
      - name: Run e2e
        env:
          PREVIEW_ORIGIN: ${{ needs.resolve.outputs.origin }}
        run: node tools/execution-context-e2e/run.ts
