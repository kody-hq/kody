name: 🧾 Teams org.migrated audit backfill

# Operator path for ADR 0063 `org.migrated` rows. Deploy does not run this.
# Dry-run prints counts and writes nothing. Apply inserts the missing success
# rows; a repeat inserts nothing. Production runs as Kent or kody-bot, from
# main, with the confirm phrase. Preview targets (kody-pr-<number> or
# kody-branch-<slug>) can run from a non-main ref so a rehearsal can use this
# file before it is on main.

on:
  workflow_dispatch:
    inputs:
      target:
        description:
          production, a preview worker (kody-pr-<number> or kody-branch-<slug>),
          or the slug preview.yml used (cig-0110 → kody-branch-cig-0110)
        required: true
        type: string
        default: production
      mode:
        description:
          dry-run prints counts and writes nothing; apply inserts missing
          org.migrated rows
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      confirm:
        description: production, either mode, type "backfill org.migrated audit"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group:
    teams-org-migrated-audit-${{ inputs.target == 'production' && 'production'
    || (startsWith(inputs.target, 'kody-pr-') && inputs.target ||
    (startsWith(inputs.target, 'kody-branch-') && inputs.target ||
    format('kody-branch-{0}', inputs.target))) }}
  cancel-in-progress: false

jobs:
  backfill:
    name: 🧾 ${{ inputs.mode }} on ${{ inputs.target }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    timeout-minutes: 60
    environment: ${{ inputs.target == 'production' && 'production' || '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.target }}
      MODE: ${{ inputs.mode }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: 🛂 Check who may run production
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "Production backfill runs from main only, got $REF." >&2
              exit 1
            fi
            # Approved production runners (Kent + kody-bot, because Cloud Agent
            # gh cannot dispatch workflows and agents dispatch through
            # @kentcdodds/github as kody-bot).
            case "$ACTOR" in
              kentcdodds|kody-bot) ;;
              *)
                echo "Production backfill runs as an approved actor only (kentcdodds or kody-bot); got $ACTOR." >&2
                exit 1
                ;;
            esac
            if [ "$CONFIRM" != "backfill org.migrated audit" ]; then
              echo 'Production needs confirm = "backfill org.migrated audit".' >&2
              exit 1
            fi
          else
            # Keep in sync with resolveRehearsalWorkerName / preview-rehearsal.yml.
            name="$(printf '%s' "$TARGET" | tr '[:upper:]' '[:lower:]' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
            if [[ "$name" =~ ^kody-pr-[0-9]+$ || "$name" =~ ^kody-branch-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              TARGET="$name"
            elif [[ "$name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              TARGET="kody-branch-$(printf '%s' "$name" | cut -c1-32)"
            else
              echo "target must be production, kody-pr-<number>, kody-branch-<slug>, or the slug preview.yml uses, got '$TARGET'." >&2
              exit 1
            fi
            echo "TARGET=$TARGET" >> "$GITHUB_ENV"
            echo "Resolved target=$TARGET"
          fi

      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🧾 Run the backfill
        id: backfill
        run: |
          set -euo pipefail
          args=(--target "$TARGET" --mode "$MODE")
          if [ -n "$CONFIRM" ]; then
            args+=(--confirm "$CONFIRM")
          fi
          node tools/teams-migration/backfill-org-migrated-audit.ts "${args[@]}" | tee backfill-report.txt

      - name: 🧾 Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## 🧾 org.migrated audit backfill (\`$MODE\`) on \`$TARGET\`"
            echo ""
            if [ -f backfill-report.txt ]; then
              echo '```'
              cat backfill-report.txt
              echo '```'
            else
              echo "No report was written; see the failed step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
