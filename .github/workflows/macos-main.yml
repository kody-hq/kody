name: 🖥️ macOS host commands (main)

# ✅ Validate skips its macOS host-command jobs on main pushes, so a GitHub
# macOS runner shortage cannot hold production deploys (#4932). PR Validate
# still requires them. This workflow runs the same macOS coverage on main,
# outside the deploy gate (deploy.yml only listens to ✅ Validate), and keeps
# one tracking issue open while it fails (tools/ci/macos-main-report.ts).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Like Validate on main: one run in progress, the newest push pending.
concurrency:
  group: macos-main
  cancel-in-progress: false

env:
  CI: '1'
  # Part of the tested-tree key; must match Validate's push-time runner label.
  VALIDATE_RUNNER: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

jobs:
  # The same tree already passed PR Validate, macOS included.
  tested_tree:
    runs-on: ubuntu-latest
    name: 🌳 Tested tree lookup
    timeout-minutes: 3
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      skip: ${{ steps.lookup.outputs.skip }}
      stamp_run_url: ${{ steps.lookup.outputs.stamp_run_url }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: 🌳 Look up PR stamp for this tree
        id: lookup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: node tools/ci/tested-tree.ts lookup

  host_commands_macos:
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    name: 🖥️ Host commands (macos-15)
    timeout-minutes: 20
    needs: tested_tree
    if: "!cancelled() && needs.tested_tree.outputs.skip != 'true'"
    env:
      KODY_SKIP_SKILL_REFRESH: '1'
      KODY_SKIP_GIT_HELPER_REFRESH: '1'
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🖥️ Host commands
        uses: ./.github/actions/host-commands

  host_commands_macos_fallback:
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    name: 🖥️ Host commands (macos-15-intel fallback)
    timeout-minutes: 20
    needs: [tested_tree, host_commands_macos]
    if: >-
      !cancelled() && needs.tested_tree.outputs.skip != 'true' &&
      needs.host_commands_macos.result == 'abandoned'
    env:
      KODY_SKIP_SKILL_REFRESH: '1'
      KODY_SKIP_GIT_HELPER_REFRESH: '1'
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🖥️ Host commands
        uses: ./.github/actions/host-commands

  report:
    runs-on: ubuntu-latest
    name: 📣 Report macOS result
    timeout-minutes: 5
    needs: [tested_tree, host_commands_macos, host_commands_macos_fallback]
    if: always() && !cancelled()
    permissions:
      contents: read
      issues: write
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false

      - name: 📣 Update tracking issue
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
        run: node tools/ci/macos-main-report.ts
