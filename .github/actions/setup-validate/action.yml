name: 🧰 Setup validate
description: Shared Node/npm setup for parallel validate jobs

inputs:
  playwright:
    description: Cache and install Playwright Chromium when true
    required: false
    default: 'false'
  worker-env:
    description: Copy packages/worker/.env.example to .env when true
    required: false
    default: 'false'
  no_cache:
    description: >
      When true, disable setup-node package-manager-cache (no npm Actions cache
      restore), skip Playwright actions/cache restore/save, and skip the Nx
      remote-cache probe (caller must also clear the remote-cache token and set
      NX_SKIP_NX_CACHE). Always runs a fresh npm ci.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: 🚫 Cache mode (no_cache)
      if: inputs.no_cache == 'true'
      shell: bash
      run: |
        {
          echo "### Cache mode: no_cache"
          echo "- NX_SKIP_NX_CACHE=${NX_SKIP_NX_CACHE:-<unset>}"
          if [ -n "${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:-}" ]; then
            echo "- NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: set (unexpected for no_cache)"
          else
            echo "- NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN: unset"
          fi
          if [ -n "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:-}" ]; then
            echo "- NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${NX_SELF_HOSTED_REMOTE_CACHE_SERVER}"
          else
            echo "- NX_SELF_HOSTED_REMOTE_CACHE_SERVER: unset"
          fi
          echo "- setup-node: package-manager-cache=false (no npm Actions cache)"
          echo "- actions/cache (Playwright): skipped"
          echo "- npm ci: fresh (--prefer-online)"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: 🟢 Setup Node (cached)
      if: inputs.no_cache != 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 26
        cache: npm

    # setup-node@v6 auto-caches npm when package.json has packageManager;
    # package-manager-cache: false is required or no_cache still restores
    # ~/.npm from the Actions cache (seen on the first ubuntu baseline).
    - name: 🟢 Setup Node (no cache)
      if: inputs.no_cache == 'true'
      uses: actions/setup-node@v6
      with:
        node-version: 26
        package-manager-cache: false

    - name: 🎭 Cache Playwright Browsers
      if: inputs.playwright == 'true' && inputs.no_cache != 'true'
      id: playwright-cache
      uses: actions/cache@v5.0.3
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: 🧊 Enable Nx remote cache
      if:
        inputs.no_cache != 'true' &&
        env.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN != ''
      shell: bash
      # Sets NX_SELF_HOSTED_REMOTE_CACHE_SERVER only when the server is
      # reachable and the token reads (Nx treats a configured-but-unauthorized
      # cache as fatal), and warns when the token cannot write, because Nx
      # itself never reports a rejected upload. Runs before `npm ci`: the
      # probe uses only Node built-ins.
      run: node tools/nx-remote-cache-probe.ts --github-env

    # npm ci talks to the public registry even on an Actions cache hit. A
    # single ECONNRESET used to fail the whole Validate job (seen on E2E
    # #40035153787 when setup-node restored a 672-byte ~/.npm cache). Retry
    # only registry transport blips; lockfile/engine errors stay terminal.
    # The helper is Node built-ins only so it can run before node_modules.
    - name: 📥 Install Dependencies
      shell: bash
      run: |
        if [ "${{ inputs.no_cache }}" = "true" ]; then
          echo "npm-cache=disabled (fresh npm ci --prefer-online)"
          node tools/ci/npm-ci-with-retry.ts --prefer-online
        else
          node tools/ci/npm-ci-with-retry.ts
        fi

    - name: 📝 Prepare worker env
      if: inputs.worker-env == 'true'
      shell: bash
      run: cp packages/worker/.env.example packages/worker/.env

    - name: 🎭 Install Playwright Browsers
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        if [ "${{ inputs.no_cache }}" = "true" ]; then
          echo "playwright-cache=skipped (no_cache)"
        else
          echo "playwright-cache-hit=${{ steps.playwright-cache.outputs.cache-hit }}"
        fi
        # Cache hit: ensure is a no-op (executable already on disk).
        # Cache miss / no_cache: download Chromium only — no apt --with-deps.
        npm run test:e2e:ensure
