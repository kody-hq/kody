invariants:
  - id: per-org-isolation
    summary: The org scopes every read/write, DO id, and vector path.
    docs:
      - docs/contributing/project-intent.md
      - docs/contributing/architecture/data-storage.md
      - docs/contributing/architecture/authorization.md

  - id: integration-host-allowlist
    summary: Enforce integration host allowlists before attaching OAuth tokens.
    docs:
      - docs/contributing/architecture/index.md
      - docs/contributing/architecture/integrations.md

  - id: canonical-repo-source
    summary: Artifacts repos are canonical package source; D1 is metadata.
    docs:
      - docs/contributing/architecture/data-storage.md

  - id: compact-mcp-surface
    summary: Keep public MCP tools small; add capabilities via search/execute.
    docs:
      - docs/contributing/project-intent.md

  - id: discovery-progressive-disclosure
    summary: Default discovery is a bounded index; expensive detail is explicit.
    docs:
      - docs/use/search.md
    adrs:
      - docs/contributing/decisions/0023-progressive-search-disclosure.md

  - id: package-over-synthesized-provider
    summary:
      Rank wrapping packages before matching synthesized MCP provider ops.
    docs:
      - docs/use/search.md
    adrs:
      - docs/contributing/decisions/0024-packages-outrank-synthesized-providers.md

  - id: bounded-always-on-mcp-text
    summary: Keep always-on MCP instructions bounded to durable essentials.
    docs:
      - docs/contributing/project-intent.md

  - id: community-listing-isolation
    summary:
      Public community reads are deliberate; forks stay inert until publish.
    docs:
      - docs/use/community-packages.md
      - docs/contributing/community-packages.md

  - id: community-social-privacy
    summary:
      Private profiles and private packages stay off public catalog surfaces.
    docs:
      - docs/contributing/community-packages.md

  - id: no-secrets-in-chat
    summary: Raw secrets never appear in prompts, chat, results, or app source.
    docs:
      - docs/contributing/architecture/data-storage.md

  - id: state-vs-history
    summary:
      Entity rows hold current state; run records hold history. Never derive
      state from history.
    docs:
      - docs/contributing/architecture/run-records.md

  - id: no-per-event-shared-writes
    summary:
      Per-event writes go to Analytics Engine or per-user DO SQLite, never the
      shared D1 writer.
    docs:
      - docs/contributing/architecture/usage-metering.md
      - docs/contributing/architecture/run-records.md
      - docs/contributing/architecture/entitlements.md

  - id: no-vendor-specific-platform-logic
    summary:
      Platform capabilities stay generic; third parties configure via params,
      not vendor-named type forks.
    docs:
      - docs/contributing/project-intent.md
      - docs/contributing/architecture/webhooks.md
      - docs/use/webhooks.md
    adrs:
      - docs/contributing/decisions/0054-no-vendor-specific-platform-logic.md
