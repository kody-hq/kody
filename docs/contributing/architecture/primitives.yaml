# Kody system primitives map (taxonomy)
#
# Stable vocabulary for the visual-recap skill
# (.agents/skills/visual-recap/SKILL.md). This is NOT a living feature
# changelog and NOT derived source-of-truth for behavior — architecture
# docs under `docs:` are. Code is the truth for implementation.
#
# Risk labels used in PR recaps:
#   composes - wires existing primitives without changing them
#   extends  - changes a primitive's behavior, shape, or contract
#   adds     - introduces a new primitive (update this file in the same PR)
#
# Update this file only when adding, removing, or materially reshaping a
# primitive (id, name, group, code roots, or meaning). Do NOT edit `summary`
# for ordinary feature work — put that in the linked architecture docs.
#
# `code` entries are coarse ownership roots for
# `classify-primitives.mjs` (longest-prefix match). Prefer directories over
# file lists. Keep the map small.
#
# `adrs` lists the decision records (docs/contributing/decisions/) that define
# or materially shape the primitive; `adrs: []` when none does. Every primitive
# declares it. Link the current record, never a superseded one. Decision
# records go in `adrs`, not `docs`. When you add or supersede a record, update
# the matching entries in the same PR. `npm run primitives:check` fails on
# missing, superseded, or misplaced paths.

version: 1

groups:
  - id: surfaces
    name: Entry points
  - id: auth
    name: Identity & auth
  - id: assistant
    name: User-facing assistant primitives
  - id: runtime
    name: Execution runtimes
  - id: storage
    name: Storage & infrastructure

primitives:
  # --- Entry points -------------------------------------------------------
  - id: app-ui
    group: surfaces
    name: Browser app (TanStack Start)
    summary:
      TanStack Start documents, Router navigation, Query server state, and
      Worker-served APIs.
    code:
      - packages/worker/start/
      - packages/worker/client/
      - packages/worker/src/app/
      - packages/worker/universal/
    docs:
      - docs/contributing/architecture/request-lifecycle.md
    adrs:
      - docs/contributing/decisions/0012-universal-layer.md
      - docs/contributing/decisions/0028-list-detail-expand.md

  - id: desktop-shell
    group: surfaces
    name: Native desktop shell
    summary:
      Electron hosts the live app, hands sign-in to the system browser, and
      supervises the CLI execution runner for the lifetime of the app.
    code:
      - packages/desktop/
    docs:
      - packages/desktop/README.md
    adrs: []

  - id: mcp-server
    group: surfaces
    name: MCP endpoint (/mcp)
    summary: OAuth-protected MCP server with a compact search/execute surface.
    code:
      - packages/worker/src/mcp/
    docs:
      - docs/contributing/project-intent.md
      - docs/contributing/adding-capabilities.md
    adrs:
      - docs/contributing/decisions/0005-mcp-dual-lane-stateless-migration.md
      - docs/contributing/decisions/0023-progressive-search-disclosure.md
      - docs/contributing/decisions/0045-guides-load-through-search.md
      - docs/contributing/decisions/0058-skills-over-mcp-progressive-enhancement.md
      - docs/contributing/decisions/0059-mcp-events-extension-behind-flag.md
      - docs/contributing/decisions/0085-execute-takes-code-only.md
      - docs/contributing/decisions/0087-mcp-events-no-client-declaration.md

  - id: status-page
    group: surfaces
    name: Public status page
    summary:
      Independently deployed status worker (status.kody.codes) probing public
      endpoints every minute, storing history in its own Durable Object, and
      emailing operator alerts under a capped policy.
    code:
      - packages/status/
    docs:
      - docs/contributing/setup-manifest.md
    adrs:
      - docs/contributing/decisions/0004-status-page-separate-worker.md

  - id: platform-worker
    group: surfaces
    name: Platform worker
    summary:
      Independently deployed platform worker owning the remaining platform
      Durable Objects (MCP, McpClientHub, OAuthPurgeCoordinator, UserMeter,
      Mailbox, RepoSession, RepoSessionIndex, StripePlanRefresh) so origin
      content deploys do not reset those objects.
    code:
      - packages/platform-worker/
      - packages/worker/src/platform-worker.ts
      - packages/shared/src/platform-worker.ts
      - tools/ci/platform-worker-config.ts
      - tools/local-sibling-dev-config.ts
    docs:
      - docs/contributing/architecture/platform-worker-migration-runbook.md
    adrs:
      - docs/contributing/decisions/0034-origin-owns-no-durable-objects.md

  - id: jobs-worker
    group: surfaces
    name: Jobs worker
    summary:
      Independently deployed jobs worker owning the JobManager Durable Object,
      the cron/scheduled dispatch lane and queue, and the dedicated kody-jobs D1
      database (jobs), calling back into the main worker for job execution.
    code:
      - packages/jobs-worker/
    docs:
      - docs/contributing/architecture/jobs-worker-migration-runbook.md
    adrs:
      - docs/contributing/decisions/0016-mono-worker-extraction.md

  - id: highlight-worker
    group: surfaces
    name: Highlight worker
    summary:
      Service-binding-only TanStack Highlight tokenizer. Origin sends snippets
      over HIGHLIGHT and receives serializable token trees; there is no public
      hostname.
    code:
      - packages/highlight-worker/
    docs:
      - docs/contributing/architecture/request-lifecycle.md
    adrs: []

  - id: push-queue-worker
    group: surfaces
    name: Push queue worker
    summary:
      Service-binding-only worker owning RepoPushQueueV1, the per-repo Durable
      Object that lands receive-pack packs in storage and sends them to
      Artifacts one at a time in FIFO order for repo-push-queue flagged repos.
    code:
      - packages/push-queue-worker/
    adrs:
      - docs/contributing/decisions/0075-repo-push-queue-worker.md

  - id: open-api
    group: surfaces
    name: Open API (api.kody.codes)
    summary:
      Public JSON HTTP API (`/openapi.json`, versioned `/v1`) served by the
      kody-api edge worker and the origin KodyApi entrypoint; also backs the MCP
      `api` tool and the local-execute CapabilityProxy. Interactive docs live on
      the separate `kody-api-docs` worker (`api-docs.kody.codes`).
    code:
      - packages/api-worker/
      - packages/api-docs-worker/
      - packages/worker/src/open-api/
      - packages/worker/src/mcp/tools/api.ts
      - tools/ci/api-worker-config.ts
    docs:
