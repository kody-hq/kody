      - packages/jobs-worker/src/scheduled.ts
      - packages/worker/src/index.ts
      - packages/worker/src/scheduled/
      - packages/worker/src/jobs/reconcile-artifacts-pushes.ts
      - packages/worker/src/repo/repo-session-cleanup.ts
      - packages/worker/src/app/retention.ts
      - packages/worker/src/account/unverified-account-purge.ts
      - packages/worker/src/app/auth-denial-alerts.ts
      - packages/worker/src/usage/aggregate-rollups.ts
    docs:
      - docs/contributing/architecture/data-storage.md
    adrs:
      - docs/contributing/decisions/0016-mono-worker-extraction.md

